<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ระบบขอลาพนักงาน</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      :root {
        --navy:#0b2f67;
        --blue:#0b63ce;
        --blue-soft:#edf5ff;
        --green:#16864b;
        --amber:#a96400;
        --red:#bd2c24;
        --purple:#6842a0;
        --border:#d7dee7;
      }
      * { box-sizing:border-box; }
      body {
        margin:0;
        background:#f5f8fc;
        color:#17202b;
        font-family:"Noto Sans Thai",system-ui,"Segoe UI",sans-serif;
      }
      button,input,select,textarea { font:inherit; }
      button { cursor:pointer; }
      .page { width:min(1080px,100%); margin:auto; padding:20px; }
      .header,.card {
        border:1px solid var(--border);
        border-radius:18px;
        background:#fff;
        box-shadow:0 10px 28px rgb(11 47 103 / 8%);
      }
      .header { position:relative; padding:24px; overflow:hidden; }
      .header::before { content:""; position:absolute; inset:0 auto 0 0; width:6px; background:var(--blue); }
      h1,h2,h3,p { margin-top:0; }
      h1 { margin-bottom:6px; color:var(--navy); font-size:clamp(25px,6vw,34px); letter-spacing:-.02em; }
      h2 { margin-bottom:14px; color:var(--navy); font-size:21px; letter-spacing:-.015em; }
      h3 { margin-bottom:8px; font-size:17px; }
      .muted { margin-bottom:0; color:#627083; }
      .status { margin-top:14px; border-radius:12px; padding:12px 14px; }
      .info { background:#e9f2ff; color:#144f98; }
      .success { background:#e5f6ed; color:var(--green); }
      .error { background:#fdecea; color:var(--red); }
      #app { display:none; }
      .card { margin-top:18px; padding:22px; }
      .form-grid {
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;
      }
      label { display:block; color:var(--navy); font-weight:700; }
      input,select,textarea {
        width:100%;
        margin-top:7px;
        border:1px solid var(--border);
        border-radius:11px;
        padding:10px 12px;
        background:#fff;
        transition:border-color .18s,box-shadow .18s;
      }
      input,select { min-height:48px; }
      textarea { min-height:96px; resize:vertical; }
      .full-width { grid-column:1 / -1; }
      .actions { display:flex; gap:10px; margin-top:14px; }
      .primary,.secondary,.approve,.reject,.cancel-leave {
        min-height:48px;
        border:0;
        border-radius:10px;
        padding:10px 14px;
        font-weight:800;
      }
      .primary { background:var(--blue); color:#fff; box-shadow:0 5px 12px rgb(11 99 206 / 18%); }
      .secondary { background:var(--blue-soft); color:var(--navy); }
      .approve { background:var(--green); color:#fff; }
      .reject { background:var(--red); color:#fff; }
      .cancel-leave { width:100%; margin-top:10px; background:#fff0ee; color:var(--red); }
      button:disabled { cursor:not-allowed; opacity:.55; }
      .manager-card { display:none; }
      .manager-card.show { display:block; }
      .request-list { display:grid; gap:10px; }
      .request-card {
        border:1px solid var(--border);
        border:1px solid var(--border);
        border-radius:14px;
        padding:13px;
        background:#fff;
        box-shadow:0 4px 14px rgb(11 47 103 / 5%);
      }
      .request-card.pending { background:#fffaf0; }
      .request-card.approved { background:#f4fbf6; }
      .request-card.rejected { background:#fff7f6; }
      .request-card.cancelled { background:#f7f8fa; }
      .request-meta {
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:7px;
        margin-top:9px;
      }
      .request-meta div {
        border-radius:8px;
        padding:8px;
        background:#f7faff;
      }
      .request-meta small { display:block; color:#6a7789; }
      .decision-actions { display:flex; gap:8px; margin-top:10px; }
      .decision-actions button { flex:1; }
      .image-help { margin:7px 0 0; color:#627083; font-size:13px; font-weight:500; }
      .image-preview-grid,.request-image-grid {
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
        gap:9px;
        margin-top:10px;
      }
      .image-preview-item { position:relative; }
      .image-preview-item img,.request-image-grid img {
        display:block;
        width:100%;
        aspect-ratio:1;
        border:1px solid var(--border);
        border-radius:12px;
        object-fit:cover;
        background:#f5f7fa;
      }
      .remove-image {
        position:absolute;
        top:5px;
        right:5px;
        min-width:36px;
        min-height:36px;
        border:0;
        border-radius:50%;
        background:rgb(20 26 34 / 82%);
        color:#fff;
        font-weight:900;
      }
      .view-images { width:100%; margin-top:10px; }
      .calendar-toolbar {
        display:grid;
        grid-template-columns:minmax(180px,1fr) auto;
        gap:10px;
        align-items:end;
      }
      .weekdays,.calendar-grid {
        display:grid;
        grid-template-columns:repeat(7,minmax(0,1fr));
        gap:6px;
      }
      .weekdays { margin-top:14px; }
      .weekdays div {
        padding:6px 2px;
        color:#627083;
        text-align:center;
        font-size:13px;
        font-weight:800;
      }
      .day {
        min-height:115px;
        border:1px solid var(--border);
        border-radius:10px;
        padding:7px;
        background:#fbfdff;
      }
      .empty-day { min-height:1px; }
      .day-number { color:var(--navy); font-weight:850; }
      .leave-event {
        margin-top:5px;
        border-radius:7px;
        padding:5px;
        background:#eee8f8;
        color:var(--purple);
        font-size:11px;
        line-height:1.3;
      }
      .empty-message {
        margin:0;
        border-radius:10px;
        padding:14px;
        background:#f5f7fa;
        color:#627083;
        text-align:center;
      }
      .backend-frame {
        position:fixed;
        left:-10px;
        bottom:-10px;
        width:1px;
        height:1px;
        border:0;
        opacity:.01;
        pointer-events:none;
      }
      @media(max-width:700px) {
        .page { padding:10px; }
        .header,.card { padding:14px; border-radius:12px; }
        .form-grid,.calendar-toolbar { grid-template-columns:1fr; }
        .request-meta { grid-template-columns:1fr 1fr; }
        .actions,.decision-actions { flex-direction:column; }
        .actions button { width:100%; }
        .weekdays,.calendar-grid { gap:3px; }
        .day { min-height:88px; padding:4px; }
        .day-number { font-size:13px; }
        .leave-event { padding:3px; font-size:9px; }
      }
      @media(max-width:960px) {
        body { width:100vw; max-width:100vw; overflow-x:hidden; background:#f3f6fa; color:#17202b; font-size:44px; line-height:1.4; }
        .page { width:100%; max-width:100%; margin:0; padding:0 0 max(24px,env(safe-area-inset-bottom)); }
        .header { display:flex; align-items:center; gap:12px; border-radius:0; padding:max(16px,env(safe-area-inset-top)) 16px 16px; border-color:#d7dee7; box-shadow:0 8px 24px rgb(22 50 79 / 8%); }
        .header::before { display:none; }
        .header-logo { width:168px; min-width:168px; height:80px; padding:3px; border-radius:14px; object-fit:cover; }
        .header-copy { min-width:0; }
        h1 { color:#16324f; font-size:44px; line-height:1.15; }
        .header .muted { font-size:44px; line-height:1.35; }
        h2 { font-size:44px; line-height:1.3; }
        .card { width:100%; max-width:100%; margin:18px 0 0; border-radius:0; padding:16px; }
        label { font-size:44px; line-height:1.45; }
        input,select,textarea { min-height:112px; padding:20px 22px; font-size:44px; line-height:1.4; }
        textarea { min-height:220px; }
        .primary,.secondary,.approve,.reject,.cancel-leave,.view-images { min-height:128px; padding:20px 24px; font-size:44px; line-height:1.4; }
        .primary { background:#1f6feb; }
        .secondary { background:#e8eef6; color:#16324f; }
        .request-card,.request-meta div,.status,.empty-message { font-size:44px; line-height:1.4; }
        .status.info::before { content:""; display:inline-block; width:34px; height:34px; margin-right:14px; border:5px solid #a8c9f4; border-top-color:var(--blue); border-radius:50%; vertical-align:-4px; animation:ui-spin .8s linear infinite; }
        .calendar-grid,.weekdays { overflow:hidden; }
        .day { min-width:0; }
      }
      @keyframes ui-spin { to { transform:rotate(360deg); } }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="header">
        <img class="header-logo" src="https://raw.githubusercontent.com/jame023/work-calendar-pages/main/assets/sip-iget-logo.png" alt="SIP i-GET Smart Integration Platform">
        <div class="header-copy">
          <h1>ระบบขอลาพนักงาน</h1>
          <p class="muted" id="profileText">กำลังตรวจสอบบัญชี LINE…</p>
        </div>
      </section>

      <div class="status info" id="statusBox">กำลังเชื่อมต่อระบบ…</div>

      <div id="app">
        <section class="card">
          <h2>ส่งคำขอลา</h2>
          <form id="leaveForm">
            <div class="form-grid">
              <label>
                วันเริ่มลา
                <input id="leaveStartDate" type="date" required>
              </label>
              <label>
                วันสิ้นสุด
                <input id="leaveEndDate" type="date" required>
              </label>
              <label>
                ประเภทการลา
                <select id="leaveType" required></select>
              </label>
              <label>
                ช่วงลา
                <select id="leaveDays" required>
                  <option value="1" data-period="เต็มวัน">เต็มวัน</option>
                  <option value="0.5" data-period="ครึ่งวันเช้า">ครึ่งวัน (เช้า)</option>
                  <option value="0.5" data-period="ครึ่งวันบ่าย">ครึ่งวัน (บ่าย)</option>
                </select>
              </label>
              <label class="full-width">
                เหตุผล
                <textarea id="leaveReason" maxlength="500" required
                  placeholder="กรุณาระบุเหตุผลการลา"></textarea>
              </label>
              <label class="full-width">
                รูปประกอบ (ไม่บังคับ สูงสุด 5 รูป)
                <input id="leaveImages" type="file" multiple
                  accept="image/jpeg,image/png,image/webp">
                <span class="image-help">รองรับ JPG, PNG และ WebP รูปละไม่เกิน 5 MB</span>
                <span class="image-preview-grid" id="imagePreview"></span>
              </label>
            </div>
            <div class="actions">
              <button class="primary" id="submitButton" type="submit">
                ส่งคำขอให้ผู้บริหาร
              </button>
            </div>
          </form>
        </section>

        <section class="card manager-card" id="managerCard">
          <h2>คำขอรออนุมัติ</h2>
          <div class="request-list" id="pendingList"></div>
        </section>

        <section class="card manager-card" id="cancelledManagerCard">
          <h2>ประวัติการยกเลิกคำขอ</h2>
          <div class="request-list" id="cancelledList"></div>
        </section>

        <section class="card">
          <h2>ปฏิทินวันลาที่อนุมัติแล้ว</h2>
          <div class="calendar-toolbar">
            <label>
              เลือกเดือน
              <input id="monthInput" type="month">
            </label>
            <button class="secondary" id="loadButton" type="button">
              โหลดปฏิทิน
            </button>
          </div>
          <div class="weekdays">
            <div>อา.</div><div>จ.</div><div>อ.</div><div>พ.</div>
            <div>พฤ.</div><div>ศ.</div><div>ส.</div>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </section>

        <section class="card">
          <h2>คำขอของฉัน</h2>
          <div class="request-list" id="ownRequestList"></div>
        </section>
      </div>
    </main>

    <iframe class="backend-frame" id="backendFrame" title="Apps Script backend"></iframe>

    <script>
      const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxiAz92e8wj0NHOUUIGwTgq_gIBEQyDmIsH3oN-Ot-fK-eqTV2PTt_h_3ssizESf6Gj/exec";
      const MESSAGE_SOURCE = "employee-leave-frontend";
      const BRIDGE_SOURCE = "employee-leave-bridge";
      const state = {
        idToken:"",
        role:"",
        month:"",
        calendar:[],
        ownRequests:[],
        pendingRequests:[],
        cancelledRequests:[]
      };
      const pendingCalls = new Map();
      const selectedImages = [];
      let bridgeWindow = null;
      let bridgeLiffId = "";
      let requestNumber = 0;
      let resolveBridge;
      const bridgeReady = new Promise(function(resolve) { resolveBridge = resolve; });
      const elements = {};

      [
        "profileText","statusBox","app","leaveForm","leaveStartDate",
        "leaveEndDate","leaveType",
        "leaveDays","leaveReason","leaveImages","imagePreview","submitButton","managerCard","pendingList",
        "cancelledManagerCard","cancelledList",
        "monthInput","loadButton","calendarGrid","ownRequestList","backendFrame"
      ].forEach(function(id) {
        elements[id] = document.getElementById(id);
      });

      window.addEventListener("message", receiveBridgeMessage);
      window.addEventListener("load", initialize);
      elements.leaveForm.addEventListener("submit", submitLeave);
      elements.leaveStartDate.addEventListener("change", updateLeaveRangeRules);
      elements.leaveDays.addEventListener("change", updateLeaveRangeRules);
      elements.leaveImages.addEventListener("change", selectLeaveImages);
      elements.loadButton.addEventListener("click", loadData);
      elements.monthInput.addEventListener("change", loadData);

      async function initialize() {
        try {
          setBusy(true);
          if (BACKEND_URL.indexOf("PASTE_") === 0) {
            throw new Error("ยังไม่ได้ใส่ Employee Leave Web App URL");
          }
          elements.backendFrame.src = BACKEND_URL;
          await waitForBridge();
          await liff.init({ liffId:bridgeLiffId, withLoginOnExternalBrowser:true });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          state.idToken = liff.getIDToken();
          if (!state.idToken) throw new Error("LINE ไม่ได้ส่ง ID token");
          elements.monthInput.value = currentMonthText();
          elements.leaveStartDate.value = todayText();
          elements.leaveEndDate.value = todayText();
          updateLeaveRangeRules();
          await loadData();
          elements.app.style.display = "block";
        } catch (error) {
          showStatus(messageOf(error), "error");
        } finally {
          setBusy(false);
        }
      }

      async function loadData() {
        const month = elements.monthInput.value || currentMonthText();
        setBusy(true);
        showStatus("กำลังโหลดข้อมูลการลา…", "info");
        try {
          const result = await callBackend("getLeaveAppData", { month:month });
          state.role = result.profile.role;
          state.month = result.month;
          state.calendar = result.calendar || [];
          state.ownRequests = result.ownRequests || [];
          state.pendingRequests = result.pendingRequests || [];
          state.cancelledRequests = result.cancelledRequests || [];
          elements.profileText.textContent =
            "เข้าสู่ระบบ: " + result.profile.employeeName +
            (state.role === "manager" ? " · ผู้บริหาร" : " · พนักงาน");
          fillLeaveTypes(result.leaveTypes || []);
          renderAll();
          showStatus("โหลดข้อมูลแล้ว", "success");
        } catch (error) {
          showStatus(messageOf(error), "error");
        } finally {
          setBusy(false);
        }
      }

      async function submitLeave(event) {
        event.preventDefault();
        const input = {
          startDate:elements.leaveStartDate.value,
          endDate:elements.leaveEndDate.value,
          type:elements.leaveType.value,
          days:Number(elements.leaveDays.value),
          period:elements.leaveDays.selectedOptions[0].dataset.period,
          reason:elements.leaveReason.value,
          images:selectedImages.map(function(image) {
            return { name:image.name, mimeType:image.mimeType, base64:image.base64 };
          })
        };
        const confirmed = window.confirm(
          "ยืนยันส่งคำขอลา?\n" +
          formatDisplayDateRange(input.startDate, input.endDate) + " · " +
          input.type + " · " +
          formatLeaveDayCount(input.days, input.period)
        );
        if (!confirmed) return;

        setBusy(true);
        showStatus("กำลังบันทึกและแจ้งผู้บริหาร…", "info");
        try {
          const result = await callBackend("submitLeaveRequest", input);
          elements.leaveReason.value = "";
          clearSelectedImages();
          const notification = result.managerNotification || {};
          if (notification.status === "error") {
            showStatus(
              "บันทึกคำขอแล้ว แต่แจ้งผู้บริหารไม่สำเร็จ: " + notification.error,
              "error"
            );
          } else {
            showStatus("ส่งคำขอและแจ้งผู้บริหารแล้ว", "success");
          }
          await loadData();
        } catch (error) {
          showStatus(messageOf(error), "error");
        } finally {
          setBusy(false);
        }
      }

      async function decideRequest(requestId, decision) {
        let rejectionReason = "";
        if (decision === "ปฏิเสธ") {
          rejectionReason = String(window.prompt(
            "กรุณาระบุเหตุผลที่ไม่อนุมัติการลา",
            ""
          ) || "").trim();
          if (!rejectionReason) {
            showStatus("ต้องระบุเหตุผลก่อนปฏิเสธคำขอ", "error");
            return;
          }
          if (rejectionReason.length > 500) {
            showStatus("เหตุผลที่ไม่อนุมัติต้องไม่เกิน 500 ตัวอักษร", "error");
            return;
          }
        }
        const confirmed = window.confirm(
          "ยืนยัน" + decision + "คำขอนี้?\n" +
          "ระบบจะแจ้งผลให้พนักงานทาง LINE"
        );
        if (!confirmed) return;
        setBusy(true);
        showStatus("กำลังบันทึกผลและแจ้งพนักงาน…", "info");
        try {
          const result = await callBackend("decideLeaveRequest", {
            requestId:requestId,
            decision:decision,
            rejectionReason:rejectionReason
          });
          const notification = result.employeeNotification || {};
          if (notification.status === "error") {
            showStatus(
              "บันทึกผลแล้ว แต่แจ้งพนักงานไม่สำเร็จ: " + notification.error,
              "error"
            );
          } else {
            showStatus("บันทึกผลและแจ้งพนักงานแล้ว", "success");
          }
          await loadData();
        } catch (error) {
          showStatus(messageOf(error), "error");
        } finally {
          setBusy(false);
        }
      }

      async function cancelRequest(row) {
        const cancellationReason = String(window.prompt(
          "กรุณาระบุเหตุผลการยกเลิก",
          ""
        ) || "").trim();
        if (!cancellationReason) {
          showStatus("ต้องระบุเหตุผลก่อนยกเลิกคำขอ", "error");
          return;
        }
        if (cancellationReason.length > 500) {
          showStatus("เหตุผลการยกเลิกต้องไม่เกิน 500 ตัวอักษร", "error");
          return;
        }
        const confirmed = window.confirm(
          "ยืนยันยกเลิกคำขอลานี้?\n" +
          formatDisplayDateRange(row.startDate || row.date, row.endDate || row.date) +
          " · " + row.type + "\n" +
          (row.status === "อนุมัติ"
            ? "รายการนี้อนุมัติแล้ว และจะถูกนำออกจากปฏิทิน/รายงาน"
            : "รายการนี้กำลังรออนุมัติ")
        );
        if (!confirmed) return;

        setBusy(true);
        showStatus("กำลังยกเลิกคำขอและแจ้งผู้บริหาร…", "info");
        try {
          const result = await callBackend("cancelLeaveRequest", {
            requestId:row.requestId,
            cancellationReason:cancellationReason
          });
          const notification = result.managerNotification || {};
          if (notification.status === "error") {
            showStatus(
              "ยกเลิกคำขอแล้ว แต่แจ้งผู้บริหารไม่สำเร็จ: " + notification.error,
              "error"
            );
          } else {
            showStatus("ยกเลิกคำขอและแจ้งผู้บริหารแล้ว", "success");
          }
          await loadData();
        } catch (error) {
          showStatus(messageOf(error), "error");
        } finally {
          setBusy(false);
        }
      }

      function renderAll() {
        elements.managerCard.classList.toggle("show", state.role === "manager");
        elements.cancelledManagerCard.classList.toggle("show", state.role === "manager");
        renderRequests(elements.pendingList, state.pendingRequests, true, true,
          "ไม่มีคำขอรออนุมัติ");
        renderRequests(elements.cancelledList, state.cancelledRequests, false, true,
          "ยังไม่มีประวัติการยกเลิก");
        renderRequests(elements.ownRequestList, state.ownRequests, false, false,
          "ยังไม่มีคำขอลา");
        renderCalendar();
      }

      function renderRequests(container, rows, showDecision, showEmployeeName, emptyText) {
        container.replaceChildren();
        if (!rows.length) {
          const empty = document.createElement("p");
          empty.className = "empty-message";
          empty.textContent = emptyText;
          container.appendChild(empty);
          return;
        }
        rows.forEach(function(row) {
          const card = document.createElement("article");
          card.className = "request-card " + statusClass(row.status);
          const title = document.createElement("h3");
          title.textContent = (showEmployeeName ? row.employeeName + " · " : "") +
            row.type;
          card.appendChild(title);

          const reason = document.createElement("p");
          reason.textContent = row.reason || "ไม่มีเหตุผล";
          card.appendChild(reason);

          if (row.status === "ปฏิเสธ" && row.rejectionReason) {
            const rejection = document.createElement("p");
            rejection.className = "status error";
            rejection.textContent = "เหตุผลที่ไม่อนุมัติ: " + row.rejectionReason;
            card.appendChild(rejection);
          }

          if (row.status === "ยกเลิก" && row.cancellationReason) {
            const cancellation = document.createElement("p");
            cancellation.className = "status info";
            cancellation.textContent = "เหตุผลยกเลิก: " + row.cancellationReason;
            card.appendChild(cancellation);
          }

          const meta = document.createElement("div");
          meta.className = "request-meta";
          const metaItems = [
            ["วันที่", formatDisplayDateRange(
              row.startDate || row.date,
              row.endDate || row.date
            )],
            ["จำนวน", formatLeaveDayCount(row.days, row.period)],
            ["สถานะ", row.status || "อนุมัติ"]
          ];
          if (row.status === "ยกเลิก") {
            metaItems.push(["สถานะเดิม", row.previousStatus || "-"]);
            metaItems.push(["ผู้ยกเลิก", row.cancelledBy || "-"]);
            metaItems.push(["เวลายกเลิก", row.cancelledAt || "-"]);
          }
          metaItems.forEach(function(item) {
            const box = document.createElement("div");
            const label = document.createElement("small");
            label.textContent = item[0];
            box.appendChild(label);
            box.appendChild(document.createTextNode(item[1]));
            meta.appendChild(box);
          });
          card.appendChild(meta);

          if (row.imageCount) {
            const imageNote = document.createElement("p");
            imageNote.className = "image-help";
            imageNote.textContent = "มีรูปแนบ " + row.imageCount + " รูป";
            card.appendChild(imageNote);
          }

          if (showDecision && row.requestId && row.imageCount) {
            const viewButton = document.createElement("button");
            viewButton.type = "button";
            viewButton.className = "secondary view-images";
            viewButton.textContent = "ดูรูปแนบ (" + row.imageCount + ")";
            const gallery = document.createElement("div");
            gallery.className = "request-image-grid";
            viewButton.addEventListener("click", function() {
              loadRequestImages(row.requestId, viewButton, gallery);
            });
            card.appendChild(viewButton);
            card.appendChild(gallery);
          }

          if (showDecision && row.requestId) {
            const actions = document.createElement("div");
            actions.className = "decision-actions";
            const approve = document.createElement("button");
            approve.type = "button";
            approve.className = "approve";
            approve.textContent = "อนุมัติ";
            approve.addEventListener("click", function() {
              decideRequest(row.requestId, "อนุมัติ");
            });
            const reject = document.createElement("button");
            reject.type = "button";
            reject.className = "reject";
            reject.textContent = "ปฏิเสธ";
            reject.addEventListener("click", function() {
              decideRequest(row.requestId, "ปฏิเสธ");
            });
            actions.appendChild(approve);
            actions.appendChild(reject);
            card.appendChild(actions);
          }
          if (!showDecision && row.requestId &&
              ["รออนุมัติ", "อนุมัติ"].includes(row.status) &&
              canCancelRequestByDate(row)) {
            const cancel = document.createElement("button");
            cancel.type = "button";
            cancel.className = "cancel-leave";
            cancel.textContent = "ยกเลิกการลา";
            cancel.addEventListener("click", function() {
              cancelRequest(row);
            });
            card.appendChild(cancel);
          }
          container.appendChild(card);
        });
      }

      function canCancelRequestByDate(row) {
        const endDate = row.endDate || row.date || "";
        return endDate && todayText() <= endDate;
      }

      function renderCalendar() {
        elements.calendarGrid.replaceChildren();
        const parts = state.month.split("-").map(Number);
        const daysInMonth = new Date(parts[0], parts[1], 0).getDate();
        const firstDay = new Date(parts[0], parts[1] - 1, 1).getDay();
        for (let index = 0; index < firstDay; index += 1) {
          const spacer = document.createElement("div");
          spacer.className = "empty-day";
          elements.calendarGrid.appendChild(spacer);
        }
        for (let day = 1; day <= daysInMonth; day += 1) {
          const isoDate = state.month + "-" + String(day).padStart(2, "0");
          const box = document.createElement("div");
          box.className = "day";
          const number = document.createElement("div");
          number.className = "day-number";
          number.textContent = day;
          box.appendChild(number);
          state.calendar.filter(function(event) {
            return event.date === isoDate;
          }).forEach(function(event) {
            const item = document.createElement("div");
            item.className = "leave-event";
            item.textContent = event.employeeName + " · " + event.type +
              (event.days === 0.5 ? " · " + formatLeaveDayCount(event.days, event.period) : "");
            if (event.reason) item.title = event.reason;
            box.appendChild(item);
          });
          elements.calendarGrid.appendChild(box);
        }
      }

      function fillLeaveTypes(types) {
        if (elements.leaveType.options.length) return;
        types.forEach(function(type) {
          const option = document.createElement("option");
          option.value = type;
          option.textContent = type;
          elements.leaveType.appendChild(option);
        });
      }

      function receiveBridgeMessage(event) {
        const data = event.data;
        if (!data || data.source !== BRIDGE_SOURCE) return;
        if (data.type === "ready") {
          bridgeWindow = event.source;
          bridgeLiffId = String(data.liffId || "");
          if (!bridgeLiffId) {
            showStatus("Bridge ไม่ส่ง LIFF ID", "error");
            return;
          }
          resolveBridge();
          return;
        }
        if (data.type !== "response" || event.source !== bridgeWindow) return;
        const request = pendingCalls.get(data.id);
        if (!request) return;
        clearTimeout(request.timer);
        pendingCalls.delete(data.id);
        data.ok ? request.resolve(data.result) :
          request.reject(new Error(data.error));
      }

      function waitForBridge() {
        return Promise.race([
          bridgeReady,
          new Promise(function(resolve, reject) {
            setTimeout(function() {
              reject(new Error("เชื่อมต่อ Apps Script ไม่สำเร็จ"));
            }, 15000);
          })
        ]);
      }

      function callBackend(action, payload) {
        return new Promise(function(resolve, reject) {
          const id = "request-" + (++requestNumber);
          const timer = setTimeout(function() {
            pendingCalls.delete(id);
            reject(new Error("Apps Script ตอบกลับช้าเกินกำหนด"));
          }, 60000);
          pendingCalls.set(id, { resolve:resolve, reject:reject, timer:timer });
          bridgeWindow.postMessage({
            source:MESSAGE_SOURCE,
            id:id,
            action:action,
            idToken:state.idToken,
            payload:payload || {}
          }, "*");
        });
      }

      function setBusy(busy) {
        [
          elements.leaveStartDate,elements.leaveEndDate,
          elements.leaveType,elements.leaveDays,
          elements.leaveReason,elements.leaveImages,elements.submitButton,elements.monthInput,
          elements.loadButton
        ].forEach(function(element) { element.disabled = busy; });
        if (!busy) updateLeaveRangeRules();
      }

      function updateLeaveRangeRules() {
        const halfDay = Number(elements.leaveDays.value) === 0.5;
        const startDate = elements.leaveStartDate.value;
        if (halfDay && startDate) elements.leaveEndDate.value = startDate;
        if (startDate && (!elements.leaveEndDate.value ||
            elements.leaveEndDate.value < startDate)) {
          elements.leaveEndDate.value = startDate;
        }
        elements.leaveEndDate.min = startDate || "";
        elements.leaveEndDate.disabled = halfDay || elements.submitButton.disabled;
      }

      async function selectLeaveImages(event) {
        const files = Array.from(event.target.files || []);
        event.target.value = "";
        if (selectedImages.length + files.length > 5) {
          showStatus("แนบรูปได้สูงสุด 5 รูป", "error");
          return;
        }
        setBusy(true);
        showStatus("กำลังเตรียมรูป…", "info");
        try {
          for (const file of files) {
            if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
              throw new Error("รองรับเฉพาะ JPG, PNG และ WebP");
            }
            if (file.size > 5 * 1024 * 1024) {
              throw new Error("รูป " + file.name + " มีขนาดเกิน 5 MB");
            }
            selectedImages.push(await compressLeaveImage(file));
          }
          renderImagePreview();
          showStatus("เตรียมรูปแล้ว " + selectedImages.length + " รูป", "success");
        } catch (error) {
          showStatus(messageOf(error), "error");
        } finally {
          setBusy(false);
        }
      }

      async function compressLeaveImage(file) {
        const image = await loadBrowserImage(file);
        const maxSide = 1280;
        const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
        let quality = 0.82;
        let blob = await canvasToBlob(canvas, quality);
        while (blob.size > 900 * 1024 && quality > 0.42) {
          quality -= 0.1;
          blob = await canvasToBlob(canvas, quality);
        }
        if (blob.size > 1024 * 1024) {
          throw new Error("บีบอัดรูป " + file.name + " ให้ต่ำกว่า 1 MB ไม่สำเร็จ");
        }
        return {
          name:file.name.replace(/\.[^.]+$/, "") + ".jpg",
          mimeType:"image/jpeg",
          base64:await blobToBase64(blob),
          previewUrl:URL.createObjectURL(blob)
        };
      }

      function loadBrowserImage(file) {
        return new Promise(function(resolve, reject) {
          const url = URL.createObjectURL(file);
          const image = new Image();
          image.onload = function() {
            URL.revokeObjectURL(url);
            resolve(image);
          };
          image.onerror = function() {
            URL.revokeObjectURL(url);
            reject(new Error("เปิดรูป " + file.name + " ไม่สำเร็จ"));
          };
          image.src = url;
        });
      }

      function canvasToBlob(canvas, quality) {
        return new Promise(function(resolve, reject) {
          canvas.toBlob(function(blob) {
            blob ? resolve(blob) : reject(new Error("บีบอัดรูปไม่สำเร็จ"));
          }, "image/jpeg", quality);
        });
      }

      function blobToBase64(blob) {
        return new Promise(function(resolve, reject) {
          const reader = new FileReader();
          reader.onload = function() {
            resolve(String(reader.result).split(",")[1] || "");
          };
          reader.onerror = function() { reject(new Error("อ่านข้อมูลรูปไม่สำเร็จ")); };
          reader.readAsDataURL(blob);
        });
      }

      function renderImagePreview() {
        elements.imagePreview.replaceChildren();
        selectedImages.forEach(function(image, index) {
          const item = document.createElement("span");
          item.className = "image-preview-item";
          const preview = document.createElement("img");
          preview.src = image.previewUrl;
          preview.alt = "รูปแนบ " + (index + 1);
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "remove-image";
          remove.textContent = "×";
          remove.setAttribute("aria-label", "ลบรูป " + (index + 1));
          remove.addEventListener("click", function() {
            URL.revokeObjectURL(selectedImages[index].previewUrl);
            selectedImages.splice(index, 1);
            renderImagePreview();
          });
          item.appendChild(preview);
          item.appendChild(remove);
          elements.imagePreview.appendChild(item);
        });
      }

      function clearSelectedImages() {
        selectedImages.forEach(function(image) { URL.revokeObjectURL(image.previewUrl); });
        selectedImages.length = 0;
        elements.leaveImages.value = "";
        renderImagePreview();
      }

      async function loadRequestImages(requestId, button, gallery) {
        if (gallery.childElementCount) {
          gallery.replaceChildren();
          button.textContent = "ดูรูปแนบ";
          return;
        }
        button.disabled = true;
        button.textContent = "กำลังโหลดรูป…";
        try {
          const images = await callBackend("getLeaveRequestImages", { requestId:requestId });
          images.forEach(function(image, index) {
            const element = document.createElement("img");
            element.src = image.dataUrl;
            element.alt = image.name || "รูปแนบ " + (index + 1);
            element.addEventListener("click", function() { window.open(image.dataUrl, "_blank"); });
            gallery.appendChild(element);
          });
          button.textContent = "ซ่อนรูป";
        } catch (error) {
          showStatus(messageOf(error), "error");
          button.textContent = "ลองโหลดรูปอีกครั้ง";
        } finally {
          button.disabled = false;
        }
      }

      function statusClass(status) {
        if (status === "รออนุมัติ") return "pending";
        if (status === "ปฏิเสธ") return "rejected";
        if (status === "ยกเลิก") return "cancelled";
        return "approved";
      }

      function formatDisplayDate(isoDate) {
        const parts = String(isoDate || "").split("-");
        return parts.length === 3 ? parts[2] + "/" + parts[1] + "/" + parts[0] : "-";
      }

      function formatDisplayDateRange(startDate, endDate) {
        const start = formatDisplayDate(startDate);
        const end = formatDisplayDate(endDate);
        return startDate === endDate ? start : start + " ถึง " + end;
      }

      function formatLeaveDayCount(days, period) {
        const value = Number(days);
        if (value === 0.5) return period || "ครึ่งวัน";
        if (value === 1) return "เต็มวัน";
        return value + " วัน";
      }

      function currentMonthText() {
        const now = new Date();
        return now.getFullYear() + "-" +
          String(now.getMonth() + 1).padStart(2, "0");
      }

      function todayText() {
        const now = new Date();
        return now.getFullYear() + "-" +
          String(now.getMonth() + 1).padStart(2, "0") + "-" +
          String(now.getDate()).padStart(2, "0");
      }

      function showStatus(message, type) {
        elements.statusBox.textContent = message;
        elements.statusBox.className = "status " + type;
      }

      function messageOf(error) {
        return error && error.message ? error.message : String(error);
      }
    </script>
  </body>
</html>
