    <script>
      (function() {
        let busyDepth = 0;
        let shownAt = 0;
        let hideTimer = 0;
        const minimumVisibleMs = 650;

        window.beginLoading = function(message) {
          busyDepth += 1;
          window.clearTimeout(hideTimer);
          hideTimer = 0;
          window.requestAnimationFrame(function() {
            const overlay = document.getElementById("loadingOverlay");
            const label = document.getElementById("loadingMessage");
            if (!overlay || busyDepth < 1) return;
            if (label) label.textContent = message || "กำลังโหลดข้อมูล…";
            if (!overlay.classList.contains("show")) shownAt = performance.now();
            overlay.classList.add("show");
            overlay.setAttribute("aria-hidden", "false");
            document.body.classList.add("is-busy");
            document.body.setAttribute("aria-busy", "true");
          });
        };

        window.endLoading = function() {
          busyDepth = Math.max(0, busyDepth - 1);
          if (busyDepth > 0) return;
          const remaining = Math.max(0, minimumVisibleMs - (performance.now() - shownAt));
          hideTimer = window.setTimeout(function() {
            if (busyDepth > 0) return;
            const overlay = document.getElementById("loadingOverlay");
            if (overlay) {
              overlay.classList.remove("show");
              overlay.setAttribute("aria-hidden", "true");
            }
            document.body.classList.remove("is-busy");
            document.body.setAttribute("aria-busy", "false");
            hideTimer = 0;
          }, remaining);
        };
      })();
    </script>
  </head>
<body class="screen-form-page">
  <header>
    <div class="wrap topbar">
      <div class="title-row">
        <div class="app-mark">
          <img src="https://raw.githubusercontent.com/jame023/work-calendar-pages/main/assets/sip-iget-logo.png" alt="SIP i-GET Smart Integration Platform">
        </div>
        <div>
          <h1>บันทึกข้อมูล Screen</h1>
          <div class="sub clean-sub">กรอกจำนวนแพ็คที่ได้และจำนวนขวดที่เสียของวันนี้</div>
        </div>
      </div>
  </header>

  <main class="wrap">
    <section class="panel">
      <div class="summary" aria-label="Current entry summary">

          <strong id="summaryDate">-</strong>
        </div>
        <div class="metric">
          <span>เครื่องจักร</span>
          <strong id="summarySheet">-</strong>
        </div>
      </div>

      <div id="dayCloseStatus" class="day-close-status">กำลังตรวจสอบสถานะปิดยอด...</div>

      <div class="form-grid">
        <label class="field full-width">
          ชื่อผู้กรอกจากบัญชี LINE <span aria-hidden="true">*</span>
          <select id="operatorName" required>
            <option value="">กำลังยืนยันตัวตน...</option>
          </select>
          <small class="help-text">ระบบจะใช้ชื่อจากบัญชี LINE ที่ยืนยันแล้ว ไม่สามารถเลือกแทนบัญชีอื่นได้</small>
        </label>
        <label class="field">
          วันที่
          <input id="entryDate" type="date" readonly>
        </label>
        <label class="field">
          เครื่องจักร
          <select id="entrySheet" onchange="syncSummary(); syncProductionDamageFields()">
            <option value="">กำลังโหลด...</option>

        <label class="field">
          จำนวนแพ็คที่ได้ของวันนี้

        <label class="field">

        </label>
        <div class="field" id="productionMachineField" hidden>

          หมายเหตุ
          <textarea id="entryNote" maxlength="500" placeholder="กรอกหมายเหตุ (ถ้ามี)"></textarea>

      <div class="actions">
        <button class="primary" id="saveButton" onclick="saveEntry()">ตรวจสอบและบันทึก</button>
        <button class="secondary" type="button" onclick="clearNumbers()">ล้างค่า</button>

  <iframe class="backend-frame" id="backendFrame" title="Apps Script backend"></iframe>

  <script>
    var SCREEN_LIFF_ID = '2010715544-2HJjI8Oh';
    var SCREEN_LIFF_REDIRECT_URI = 'https://jame023.github.io/work-calendar-pages/screen-manual/index.html';
    var SCREEN_BACKEND_URL = 'https://script.google.com/a/macros/psru.ac.th/s/AKfycbyNPX3FcS_1SPg3VQ_r4tPzgzx1YCGdkucq9IiyFM0iEnpT_KVS1ag61CJgCyTbq3e7/exec?bridge=1&v=71';
    var SCREEN_MESSAGE_SOURCE = 'screen-frontend';
    var SCREEN_BRIDGE_SOURCE = 'screen-bridge';
    var SCREEN_LINE_REAUTH_KEY = 'screen-line-reauth-attempt';
    var screenIdToken = '';
    var screenUserName = '';
    var screenConfig = null;
    var lastSavedRequestId = '';
    var lastUndoUntil = 0;
    var undoTimer = null;
    var currentDayClosed = false;
    var editMode = false;
    var editingRequestId = '';
    var editLocksMachine = false;

    function loadConfig() {
      beginLoading('กำลังยืนยันตัวตน LINE…');
      initializeScreenAuth()
        .then(function() {
          return callScreenBackend('getEntryConfig', {});
        })
        .then(function(config) {
          endLoading();
          screenConfig = config;
          screenUserName = config.user && config.user.name
            ? config.user.name
            : (config.operators || [])[0] || '';
          document.getElementById('entryDate').value = config.defaultDate || '';
          renderMachineOptions(config.machines || []);
          renderOperatorOptions(screenUserName ? [screenUserName] : []);
          var operatorSelect = document.getElementById('operatorName');
          operatorSelect.value = screenUserName;
          operatorSelect.disabled = true;
          syncSummary();
          document.getElementById('enteredPack').focus();
        })
        .catch(function(error) {
          endLoading();
          if (!handleScreenError(error)) {
            disableManualForm();
            setStatus('โหลดข้อมูลไม่สำเร็จ: ' + getErrorMessage(error), true);
          }
        });
    }

    function initializeScreenAuth() {
      if (!SCREEN_LIFF_ID) {
        return Promise.reject(new Error('ระบบยังไม่ได้ตั้งค่า SCREEN_LIFF_ID'));
      }
      if (!window.liff) {
        return Promise.reject(new Error('โหลด LIFF ไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ'));
      }
      var bridgePromise = Promise.resolve();
      if (SCREEN_BACKEND_URL && backendFrame) {
        backendFrame.src = SCREEN_BACKEND_URL;
        bridgePromise = waitForScreenBridge();
      }
      return bridgePromise
        .then(function() {
          return liff.init({
            liffId: screenBridgeLiffId || SCREEN_LIFF_ID,
            withLoginOnExternalBrowser: true
          });
        })
        .then(function() {
          if (!liff.isLoggedIn()) {
            liff.login({ redirectUri: SCREEN_LIFF_REDIRECT_URI });
            throw new Error('กรุณาเข้าสู่ระบบ LINE');
          }
          screenIdToken = liff.getIDToken() || '';
          if (!screenIdToken) {
            throw new Error('กรุณาเข้าสู่ระบบผ่าน LINE ใหม่ [LINE_AUTH:TOKEN_MISSING]');
          }
        });
    }

    var pendingScreenCalls = new Map();
    var screenBridgeWindow = null;
    var screenBridgeLiffId = '';
    var screenRequestNumber = 0;
    var resolveScreenBridge;
    var screenBridgeReady = new Promise(function(resolve) {
      resolveScreenBridge = resolve;
    });
    var backendFrame = document.getElementById('backendFrame');

    function receiveScreenBridgeMessage(event) {
      var data = event.data;
      if (!data || data.source !== SCREEN_BRIDGE_SOURCE) return;
      if (data.type === 'ready') {
        screenBridgeWindow = event.source;
        screenBridgeLiffId = String(data.liffId || '');
        if (!screenBridgeLiffId) {
          setStatus('Bridge ไม่ส่ง LIFF ID', true);
          return;
        }
        resolveScreenBridge();
        return;
      }
      if (data.type !== 'response' || event.source !== screenBridgeWindow) return;
      var request = pendingScreenCalls.get(data.id);
      if (!request) return;
      clearTimeout(request.timer);
      pendingScreenCalls.delete(data.id);
      data.ok
        ? request.resolve(data.result)
        : request.reject(new Error(data.error || 'เกิดข้อผิดพลาด'));
    }

    window.addEventListener('message', receiveScreenBridgeMessage);

    function waitForScreenBridge() {
      return Promise.race([
        screenBridgeReady,
        new Promise(function(resolve, reject) {
          setTimeout(function() {
            reject(new Error('เชื่อมต่อ Apps Script ไม่สำเร็จ'));
          }, 15000);
        })
      ]);
    }

    function callScreenBackend(action, payload) {
      if (!screenIdToken) {
        return Promise.reject(new Error('กรุณาเข้าสู่ระบบผ่าน LINE ใหม่ [LINE_AUTH:TOKEN_MISSING]'));
      }
      return new Promise(function(resolve, reject) {
        if (!screenBridgeWindow) {
          reject(new Error('เชื่อมต่อ Apps Script ไม่สำเร็จ'));
          return;
        }
        var id = 'screen-request-' + (++screenRequestNumber);
        var timer = setTimeout(function() {
          pendingScreenCalls.delete(id);
          reject(new Error('Apps Script ตอบกลับช้าเกินกำหนด'));
        }, 60000);
        pendingScreenCalls.set(id, {
          resolve: resolve,
          reject: reject,
          timer: timer
        });
        screenBridgeWindow.postMessage({
          source: SCREEN_MESSAGE_SOURCE,
          id: id,
          action: action,
          idToken: screenIdToken,
          payload: payload || {}
        }, '*');
      });
    }

    function handleScreenError(error) {
      var message = getErrorMessage(error);
      if (recoverScreenLineSession(error)) return true;
      if (isScreenPermissionError(message)) {
        disableManualForm();
        setStatus('คุณไม่มีสิทธิ์ใช้งานหน้ากรอกข้อมูล Screen', true);
        return true;
      }
      return false;
    }

    function recoverScreenLineSession(error) {
      var message = getErrorMessage(error);
      var isLineSessionError = message.indexOf('LINE_AUTH:TOKEN_MISSING') !== -1 ||
        message.indexOf('LINE_AUTH:TOKEN_EXPIRED') !== -1 ||
        message.indexOf('LINE_AUTH:INVALID_ID_TOKEN') !== -1 ||
        message.indexOf('LINE_AUTH:VERIFY_REJECTED') !== -1 ||
        message.indexOf('กรุณาเข้าสู่ระบบผ่าน LINE ใหม่') !== -1 ||
        message.indexOf('การยืนยันตัวตน LINE ไม่ถูกต้องหรือหมดอายุ') !== -1 ||
        message.indexOf('LINE Token หมดอายุ') !== -1;
      if (!isLineSessionError || !window.liff || typeof liff.login !== 'function') return false;
      if (sessionStorage.getItem(SCREEN_LINE_REAUTH_KEY) === '1') {
        sessionStorage.removeItem(SCREEN_LINE_REAUTH_KEY);
        return false;
      }
      sessionStorage.setItem(SCREEN_LINE_REAUTH_KEY, '1');
      screenIdToken = '';
      setStatus('เซสชัน LINE หมดอายุ · กำลังเข้าสู่ระบบใหม่…');
      try {
        if (typeof liff.isLoggedIn !== 'function' || liff.isLoggedIn()) liff.logout();
      } catch (logoutError) {}
      liff.login({ redirectUri: SCREEN_LIFF_REDIRECT_URI });
      return true;
    }

    function isScreenPermissionError(message) {
      var text = String(message || '');
      return text.indexOf('ไม่มีสิทธิ์บันทึกข้อมูล Screen') !== -1 ||
        text.indexOf('ไม่ได้อยู่ในรายชื่อพนักงาน Active') !== -1 ||
        text.indexOf('ยังไม่มี Employee_Name') !== -1;
    }

    function disableManualForm() {
      document.querySelectorAll('input, select, textarea, button').forEach(function(control) {
        control.disabled = true;
      });
    }

    function renderOperatorOptions(operators) {
      var selector = document.getElementById('operatorName');
      selector.innerHTML = '<option value="">กำลังยืนยัน...</option>' +
        operators.map(function(name) {
          return '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + '</option>';
        }).join('');
    }

    function syncProductionDamageFields() {
      var hasProductionDamage = Number(document.getElementById('productionDamagedBottles').value || 0) > 0;
      document.getElementById('productionMachineField').hidden = !hasProductionDamage;
      var option = document.getElementById('entrySheet').selectedOptions[0];
      document.getElementById('productionMachineLabel').textContent =
        option ? (option.getAttribute('data-production-label') || '-') : '-';
    }

    function renderMachineOptions(machines) {
      var selector = document.getElementById('entrySheet');
      selector.innerHTML = machines.map(function(machine) {
        return '<option value="' + escapeHtml(machine.sheetName) + '" data-production-label="' +
          escapeHtml(machine.productionMachineLabel || '') + '">' +
          escapeHtml(machine.label) + '</option>';
      }).join('');
    }

    function syncSummary() {
      document.getElementById('summaryDate').textContent =
        document.getElementById('entryDate').value || '-';
      var machineSelector = document.getElementById('entrySheet');
      document.getElementById('summarySheet').textContent =
        machineSelector.selectedIndex >= 0 ? machineSelector.options[machineSelector.selectedIndex].text : '-';
      loadDailyCloseStatus();
    }

    function loadDailyCloseStatus() {
      var date = document.getElementById('entryDate').value;
      var sheet = document.getElementById('entrySheet').value;
      if (!date || !sheet || !screenIdToken) return;

      document.getElementById('saveButton').disabled = true;
      beginLoading('กำลังตรวจสอบข้อมูล…');
      document.getElementById('dayCloseStatus').className = 'day-close-status';
      document.getElementById('dayCloseStatus').textContent = 'กำลังตรวจสอบสถานะปิดยอด...';
      callScreenBackend('getDailyCloseStatus', { date: date, sheet: sheet })
        .then(function(result) {
          endLoading();
          renderDailyCloseStatus(result);
        })
        .catch(function(error) {
          endLoading();
          if (handleScreenError(error)) return;
          currentDayClosed = true;
          document.getElementById('dayCloseStatus').className = 'day-close-status closed';
          document.getElementById('dayCloseStatus').textContent =
            'ตรวจสอบสถานะไม่สำเร็จ: ' + getErrorMessage(error);
          updateUndoButton();
          updateEditButton();
        });
    }

    function renderDailyCloseStatus(result) {
      currentDayClosed = !!result.closed;
      var status = document.getElementById('dayCloseStatus');
      var detail = result.operator
        ? ' โดย ' + result.operator + (result.timestamp ? ' เวลา ' + new Date(result.timestamp).toLocaleString('th-TH') : '')
        : '';
      status.className = 'day-close-status' + (currentDayClosed ? ' closed' : '');
      status.textContent = currentDayClosed ? 'ปิดยอดแล้ว' + detail : 'เปิดรับข้อมูล Manual';
      document.getElementById('saveButton').disabled = currentDayClosed;
      updateUndoButton();
      updateEditButton();
    }

    function saveEntry() {
      var button = document.getElementById('saveButton');
      var date = document.getElementById('entryDate').value;
      var sheet = document.getElementById('entrySheet').value;
      var enteredPack = document.getElementById('enteredPack').value;
      var missingBottles = document.getElementById('missingBottles').value;
      var productionDamagedBottles = document.getElementById('productionDamagedBottles').value;
      var note = document.getElementById('entryNote').value;
      var operatorName = document.getElementById('operatorName').value.trim();

      if (!screenIdToken) {
        setStatus('กรุณาเข้าสู่ระบบผ่าน LINE ก่อนบันทึก', true);
        return;
      }

      if (currentDayClosed) {
        setStatus('วันนี้ปิดยอดแล้ว กรุณาเปิดยอดก่อนบันทึก', true);
        return;
      }

      if (!date) {
        setStatus('วันที่ยังไม่พร้อม กรุณารีเฟรชหน้าเว็บ', true);
        return;
      }

      if (!operatorName) {
        setStatus('กรุณาเลือกชื่อผู้กรอก', true);
        document.getElementById('operatorName').focus();
        return;
      }

      if (!enteredPack && !missingBottles && !productionDamagedBottles) {
        setStatus('กรอกจำนวนแพ็ค จำนวนเสียจากสกรีน หรือจำนวนเสียจากผลิตอย่างน้อย 1 ช่อง', true);
        return;
      }
      var confirmation = [
        'กรุณาตรวจสอบข้อมูลก่อนบันทึก',
        '',
        'ชื่อผู้กรอก: ' + operatorName,
        'วันที่: ' + date,
        'เครื่องจักร: ' + document.getElementById('summarySheet').textContent,
        'จำนวนแพ็คที่ได้ของวันนี้: +' + (enteredPack || '0'),
        'จำนวนเสียจากสกรีน: +' + (missingBottles || '0'),
        'จำนวนเสียจากผลิต: +' + (productionDamagedBottles || '0'),
        Number(productionDamagedBottles || 0) > 0 ? 'เพิ่มยอดเสียที่: ' + document.getElementById('productionMachineLabel').textContent : '',
        'หมายเหตุ: ' + (note.trim() || '-')
      ].join('\n');
      if (!window.confirm(confirmation)) {
        setStatus('ยกเลิกก่อนบันทึก สามารถแก้ไขข้อมูลแล้วลองใหม่ได้', false);
        return;
      }

      var isEditSubmission = editMode;
      var requestId = isEditSubmission ? editingRequestId : getPendingRequestId();
      if (isEditSubmission && localStorage.getItem('manualLastSavedRequestId') !== editingRequestId) {
        setStatus('Browser นี้บันทึกรายการใหม่กว่าแล้ว กรุณาโหลดรายการล่าสุดใหม่ก่อนแก้ไข', true);
        return;
      }

      button.disabled = true;
      beginLoading('กำลังบันทึกข้อมูล…');
      setStatus('กำลังบันทึก กรุณาอย่าปิดหน้านี้...', false);
      var successHandler = function(result) {
          endLoading();
          showSaveSuccessModal();
          setStatus(
            (isEditSubmission ? 'แก้ไขรายการสำเร็จ: ' :
              (result.duplicate ? 'รายการนี้ถูกบันทึกไว้แล้ว: ' : 'บันทึกสำเร็จ: ')) +
            result.sheetName + ' | แพ็ครวมวันนี้ ' + result.enteredPackTotal +
            ' | จำนวนขวดจาก Pack ' + result.bottlesFromPackTotal +
            ' | เสียจากสกรีนรวม ' + result.missingBottlesTotal +
            (Number(result.productionDamagedAdded || 0) > 0
              ? ' | รอรวมเสียจากผลิต ' + result.productionDamagedAdded + ' (' + result.productionMachineLabel + ')'
              : ''),
            false,
            true
          );
          if (!isEditSubmission) sessionStorage.removeItem('counterPendingRequestId');
          lastSavedRequestId = result.requestId;
          localStorage.setItem('manualLastSavedRequestId', result.requestId);
          lastUndoUntil = Number(result.undoUntil) || 0;
          updateUndoButton();
          updateEditButton();
          if (!isEditSubmission) clearNumbers();
          button.disabled = false;
        };
      var failureHandler = function(error) {
          endLoading();
          if (handleScreenError(error)) return;
          setStatus('บันทึกไม่สำเร็จ: ' + getErrorMessage(error), true);
          button.disabled = false;
        };
      var savePayload = {
        requestId: requestId,
        date: date,
        sheetName: sheet,
        enteredPack: enteredPack,
        missingBottles: missingBottles,
        productionDamagedBottles: productionDamagedBottles,
        note: note,
        operatorName: operatorName
      };
      var savePromise = isEditSubmission
        ? callScreenBackend('updateManualEntry', savePayload)
        : callScreenBackend('saveManualEntry', savePayload);
      savePromise.then(successHandler).catch(failureHandler);
    }

    function loadLatestEntryForEdit() {
      var requestId = localStorage.getItem('manualLastSavedRequestId') || '';
      if (!requestId) {
        setStatus('ยังไม่มีรายการล่าสุดที่ Browser นี้บันทึกสำเร็จ', true);
        return;
      }
      var button = document.getElementById('editLatestButton');
      button.disabled = true;
      beginLoading('กำลังโหลดรายการล่าสุด…');
      callScreenBackend('getManualEntryForEdit', { requestId: requestId })
        .then(function(result) {
          endLoading();
          editMode = true;
          editingRequestId = result.requestId;
          editLocksMachine = result.lockMachine === true;
          document.getElementById('entryDate').value = result.date;
          document.getElementById('entrySheet').value = result.sheetName;
          document.getElementById('operatorName').value = screenUserName;
          document.getElementById('enteredPack').value = result.enteredPack;
          document.getElementById('missingBottles').value = result.missingBottles;
          document.getElementById('productionDamagedBottles').value = result.productionDamagedBottles;
          document.getElementById('entryNote').value = result.note || '';
          document.getElementById('entrySheet').disabled = editLocksMachine;
          document.getElementById('saveButton').textContent = 'ตรวจสอบและบันทึกการแก้ไข';
          button.hidden = true;
          document.getElementById('returnToNewButton').hidden = false;
          syncSummary();
          syncProductionDamageFields();
          setStatus('กำลังแก้ไขรายการล่าสุดของ Browser นี้' +
            (editLocksMachine ? ' | รายการนี้ผูกยอดเสียจากผลิต จึงเปลี่ยนเครื่องจักรไม่ได้' : ''), false);
        })
        .catch(function(error) {
          endLoading();
          updateEditButton();
          if (handleScreenError(error)) return;
          setStatus('โหลดรายการแก้ไขไม่สำเร็จ: ' + getErrorMessage(error), true);
        });
    }

    function returnToNewEntry() {
      editMode = false;
      editingRequestId = '';
      editLocksMachine = false;
      document.getElementById('entrySheet').disabled = false;
      document.getElementById('saveButton').textContent = 'ตรวจสอบและบันทึก';
      document.getElementById('editLatestButton').hidden = false;
      document.getElementById('returnToNewButton').hidden = true;
      clearNumbers();
      updateEditButton();
      setStatus('พร้อมบันทึกรายการใหม่', false);
    }

    function updateEditButton() {
      var button = document.getElementById('editLatestButton');
      button.disabled = !localStorage.getItem('manualLastSavedRequestId');
    }

    function getPendingRequestId() {
      var requestId = sessionStorage.getItem('counterPendingRequestId');
      if (!requestId) {
        requestId = 'manual_' + Date.now() + '_' + Math.random().toString(36).slice(2, 12);
        sessionStorage.setItem('counterPendingRequestId', requestId);
      }
      return requestId;
    }

    function undoLastEntry() {
      var operatorName = document.getElementById('operatorName').value.trim();
      if (currentDayClosed) {
        setStatus('วันนี้ปิดยอดแล้ว กรุณาเปิดยอดก่อนยกเลิกรายการ', true);
        return;
      }
      if (!lastSavedRequestId || Date.now() > lastUndoUntil) {
        setStatus('หมดเวลายกเลิกรายการล่าสุดแล้ว', true);
        updateUndoButton();
        return;
      }
      if (!window.confirm('ยืนยันยกเลิกรายการล่าสุดและคืนยอดเดิม?')) return;

      var button = document.getElementById('undoButton');
      button.disabled = true;
      beginLoading('กำลังยกเลิกรายการ…');
      setStatus('กำลังยกเลิกรายการล่าสุด...', false);
      var successHandler = function(result) {
          endLoading();
          setStatus(
            'ยกเลิกรายการแล้ว: ' + result.sheetName +
            ' | แพ็ครวมวันนี้ ' + result.enteredPackTotal +
            ' | จำนวนขวดจาก Pack ' + result.bottlesFromPackTotal +
            ' | เสียจากสกรีนรวม ' + result.missingBottlesTotal +
            (Number(result.productionDamageUndone || 0) > 0
              ? ' | คืนเสียจากผลิต ' + result.productionDamageUndone + ' (' + result.productionMachineLabel + ')'
              : ''),
            false,
            true
          );
          lastSavedRequestId = '';
          lastUndoUntil = 0;
          if (localStorage.getItem('manualLastSavedRequestId') === result.requestId) {
            localStorage.removeItem('manualLastSavedRequestId');
          }
          updateUndoButton();
          updateEditButton();
        };
      var failureHandler = function(error) {
          endLoading();
          if (handleScreenError(error)) return;
          setStatus('ยกเลิกไม่สำเร็จ: ' + getErrorMessage(error), true);
          updateUndoButton();
        };
      callScreenBackend('undoManualEntry', {
        requestId: lastSavedRequestId,
        operatorName: operatorName
      }).then(successHandler).catch(failureHandler);
    }

    function updateUndoButton() {
      var button = document.getElementById('undoButton');
      var remaining = lastUndoUntil - Date.now();
      if (undoTimer) clearTimeout(undoTimer);
      if (currentDayClosed || !lastSavedRequestId || remaining <= 0) {
        button.disabled = true;
        button.textContent = currentDayClosed ? 'ปิดยอดแล้ว' : 'ยกเลิกรายการล่าสุด';
        return;
      }
      button.disabled = false;
      button.textContent = 'ยกเลิกรายการล่าสุด (' + Math.ceil(remaining / 1000) + ' วิ)';
      undoTimer = setTimeout(updateUndoButton, 1000);
    }

    function clearNumbers() {
      document.getElementById('enteredPack').value = '';
      document.getElementById('missingBottles').value = '';
      document.getElementById('entryNote').value = '';
      document.getElementById('enteredPack').focus();
    }

    function setStatus(message, isError, isOk) {
      var status = document.getElementById('status');
      status.className = 'status' + (isError ? ' error' : '') + (isOk ? ' ok' : '');
      status.textContent = normalizeStatusMessage(message, isError, isOk);
    }

    function normalizeStatusMessage(message, isError, isOk) {
      var text = String(message || '');
      return text || (isError ? 'เกิดข้อผิดพลาด กรุณาลองใหม่' : 'กำลังทำรายการ...');
    }

    function getErrorMessage(error) {
      return error && error.message ? error.message : String(error);
    }

    function escapeHtml(value) {
      return String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    var saveSuccessReturnFocus = null;
    function showSaveSuccessModal() {
      saveSuccessReturnFocus = document.activeElement;
      var modal = document.getElementById('saveSuccessModal');
      modal.classList.add('show');
      modal.setAttribute('aria-hidden', 'false');
      document.getElementById('saveSuccessAcknowledge').focus();
    }

    function hideSaveSuccessModal() {
      var modal = document.getElementById('saveSuccessModal');
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden', 'true');
      if (saveSuccessReturnFocus && saveSuccessReturnFocus.focus) saveSuccessReturnFocus.focus();
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && document.getElementById('saveSuccessModal').classList.contains('show')) hideSaveSuccessModal();
    });

    document.getElementById('status').textContent = 'พร้อมบันทึกข้อมูล';
    loadConfig();
  </script>
    <div class="save-success-modal" id="saveSuccessModal" role="alertdialog" aria-modal="true" aria-labelledby="saveSuccessTitle" aria-hidden="true">
      <div class="save-success-panel">
        <div class="save-success-icon" aria-hidden="true">✓</div>
        <h2 class="save-success-title" id="saveSuccessTitle">บันทึกเสร็จแล้ว</h2>
        <button class="save-success-acknowledge" id="saveSuccessAcknowledge" type="button" onclick="hideSaveSuccessModal()">รับทราบ</button>
      </div>
    </div>
    <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite" aria-hidden="true">
      <div class="loading-panel">
        <span class="loading-spinner" aria-hidden="true"></span>
        <span id="loadingMessage">กำลังโหลดข้อมูล…</span>
      </div>
    </div>
</body>
</html>
