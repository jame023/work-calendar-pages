<!doctype html>
<html lang="th">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>ข้อมูลของฉัน / งานค้างวันนี้</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
      :root {
        --blue: #075bc7;
        --blue-dark: #082e69;
        --navy: #10254b;
        --muted: #5f6f89;
        --line: #dce4ef;
        --surface: #f7faff;
        --surface-blue: #edf5ff;
        --green: #10964b;
        --amber: #d97706;
        --red: #dc2626;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--surface);
        color: var(--navy);
        font-family: "Noto Sans Thai", Tahoma, sans-serif;
        font-size: 16px;
        line-height: 1.45;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: max(18px, env(safe-area-inset-top)) 18px 14px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 2px 12px rgba(8, 46, 105, 0.06);
        text-align: center;
      }

      h1 {
        margin: 0;
        color: var(--blue-dark);
        font-size: 26px;
        letter-spacing: -0.02em;
      }

      h2 {
        margin: 22px 0 10px;
        font-size: 20px;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 18px 16px 104px;
      }

      .profile {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-end;
        margin: 4px 2px 16px;
        padding: 4px 2px;
      }

      .profile strong {
        font-size: 20px;
      }

      .muted {
        color: var(--muted);
        font-size: 13px;
      }

      .pending-detail {
        display: block;
      }

      .today-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1.25fr;
        padding: 14px 4px;
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(16, 37, 75, 0.06);
      }

      .today-item {
        padding: 2px 8px;
        border-right: 1px solid var(--line);
        text-align: center;
      }

      .today-item:last-child {
        border-right: 0;
      }

      .value {
        color: var(--blue);
        font-size: 26px;
        font-weight: 800;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 14px rgba(16, 37, 75, 0.05);
      }

      .metric {
        padding: 12px 4px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        text-align: center;
      }

      .metric:nth-child(3n) {
        border-right: 0;
      }

      .metric:nth-child(n + 4) {
        border-bottom: 0;
      }

      .metric strong {
        display: block;
        font-size: 20px;
      }

      .attendance-calendar {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--white);
        box-shadow: 0 4px 14px rgba(16, 37, 75, 0.05);
      }

      .calendar-month {
        margin-bottom: 12px;
        color: var(--blue-dark);
        font-size: 18px;
        font-weight: 800;
        text-align: center;
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 5px;
      }

      .calendar-weekday {
        padding: 4px 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-align: center;
      }

      .calendar-day {
        min-width: 0;
        min-height: 68px;
        padding: 7px 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
        text-align: center;
      }

      .calendar-day.empty {
        border-color: transparent;
        background: transparent;
      }

      .calendar-date {
        display: block;
        font-size: 15px;
        font-weight: 800;
      }

      .calendar-status {
        display: block;
        margin-top: 5px;
        font-size: 11px;
        font-weight: 750;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .calendar-day.present-full {
        border-color: #86d7aa;
        background: #e9f8ef;
        color: #08783a;
      }

      .calendar-day.present-half {
        border-color: #f0cf69;
        background: #fff7d6;
        color: #8a5a00;
      }

      .calendar-day.absent {
        border-color: #f2a3a3;
        background: #feeeee;
        color: #b91c1c;
      }

      .calendar-day.leave {
        border-color: #f2ad5b;
        background: #fff0dc;
        color: #a0440b;
      }

      .calendar-legend {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 14px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .legend-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 4px;
        border-radius: 50%;
      }

      .legend-dot.present-full { background: var(--green); }
      .legend-dot.present-half { background: #e6ad16; }
      .legend-dot.absent { background: var(--red); }
      .legend-dot.leave { background: #ed7c18; }

      .list {
        display: grid;
        gap: 8px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--white);
        box-shadow: 0 3px 10px rgba(16, 37, 75, 0.04);
      }

      .row-main {
        flex: 1;
        min-width: 0;
      }

      .row-title {
        font-weight: 750;
        color: var(--blue-dark);
      }

      .count {
        color: var(--red);
        font-size: 20px;
        font-weight: 800;
      }

      .tabs {
        display: flex;
        gap: 8px;
        margin: 4px 0 18px;
      }

      button,
      .link {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 8px 13px;
        border: 1px solid var(--blue);
        border-radius: 9px;
        background: var(--white);
        color: var(--blue);
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }

      .tabs button {
        flex: 1;
      }

      .tabs button.active {
        background: var(--blue);
        color: var(--white);
      }

      .refresh-button {
        position: fixed;
        right: 16px;
        bottom: max(14px, env(safe-area-inset-bottom));
        left: 16px;
        max-width: 688px;
        margin: auto;
        border: 0;
        background: var(--blue);
        box-shadow: 0 5px 18px #075bc733;
        color: var(--white);
      }

      .status-message {
        padding: 22px;
        color: var(--muted);
        text-align: center;
      }

      .success {
        color: var(--green);
      }

      .warning {
        color: var(--amber);
      }

      .danger {
        color: var(--red);
      }

      .hidden {
        display: none !important;
      }

      .backend-frame {
        position: fixed;
        width: 1px;
        height: 1px;
        border: 0;
        opacity: 0;
        pointer-events: none;
      }

      .pending-detail {
        padding: 2px 0;
        color: var(--navy);
        line-height: 1.45;
      }

      h2 {
        color: var(--blue-dark);
        letter-spacing: -0.01em;
      }

      .today-item .value.success,
      .metric strong.success {
        color: var(--green);
      }

      .link {
        min-width: 82px;
        justify-content: center;
        border-radius: 8px;
        background: #fff;
      }

      @media (max-width: 390px) {
        body {
          font-size: 16px;
        }

        .today-grid {
          grid-template-columns: 1fr 1fr;
        }

        .today-item:nth-child(2) {
          border-right: 0;
        }

        .today-item:last-child {
          grid-column: 1 / -1;
          margin-top: 10px;
          padding-top: 10px;
          border-top: 1px solid var(--line);
        }

        .row {
          align-items: flex-start;
        }

        .row .link {
          min-width: 70px;
          padding-right: 8px;
          padding-left: 8px;
        }

        .attendance-calendar {
          padding: 10px 8px;
        }

        .calendar-grid {
          gap: 3px;
        }

        .calendar-day {
          min-height: 58px;
          padding: 5px 2px;
          border-radius: 6px;
        }

        .calendar-date {
          font-size: 14px;
        }

        .calendar-status {
          font-size: 9px;
        }
      }

      @media (max-width: 960px) {
        body { width:100vw; max-width:100vw; overflow-x:hidden; font-size:44px; line-height:1.4; }
        header { display:flex; align-items:center; gap:12px; padding:max(16px,env(safe-area-inset-top)) 16px 16px; text-align:left; }
        .header-logo { width:196px; min-width:196px; height:94px; padding:3px; border-radius:14px; object-fit:cover; }
        h1 { min-width:0; font-size:56px; line-height:1.15; }
        h2,.profile strong,.row-title { font-size:50px; line-height:1.4; }
        main { width:100%; max-width:100%; margin:0; padding:0 0 190px; }
        .profile,.today-grid,.metrics,.attendance-calendar,.list,.row,.tabs { width:100%; max-width:100%; margin-left:0; margin-right:0; border-radius:0; }
        .muted,.value,.metric strong,.calendar-month,.status-message,.pending-detail { font-size:44px; line-height:1.4; overflow-wrap:anywhere; }
        button,.link { min-height:152px; padding:24px 28px; font-size:44px; line-height:1.4; }
        .refresh-button { right:0; left:0; bottom:0; max-width:none; border-radius:0; }
        .status-message::before { content:""; display:inline-block; width:34px; height:34px; margin-right:14px; border:5px solid #b9cce5; border-top-color:var(--blue); border-radius:50%; vertical-align:-4px; animation:ui-spin .8s linear infinite; }
        .calendar-day { min-width:0; }
        .calendar-date { font-size:22px; }
        .calendar-status,.calendar-weekday,.calendar-legend { font-size:18px; }
      }
      @keyframes ui-spin { to { transform:rotate(360deg); } }
    </style>
  </head>

  <body>
    <header>
      <img class="header-logo" src="https://raw.githubusercontent.com/jame023/work-calendar-pages/main/assets/sip-iget-logo.png" alt="SIP i-GET Smart Integration Platform">
      <h1 id="pageTitle">กำลังเชื่อมต่อ…</h1>
    </header>

    <main>
      <div id="statusMessage" class="status-message">กรุณารอสักครู่</div>
      <div id="app" class="hidden"></div>
    </main>

    <button id="refreshButton" class="refresh-button hidden" type="button">
      รีเฟรชข้อมูล
    </button>

    <iframe
      id="backendFrame"
      class="backend-frame"
      title="Apps Script backend"
    ></iframe>

    <script>
      const BACKEND_URL = "https://script.google.com/macros/s/AKfycbztndg5WffAGRJQUZ8Ptai4gYox3DVrjKZU90fj8miaploHoQBpsMGr_O57V2nkUvtM/exec";
      const MESSAGE_SOURCE = "my-overview-frontend";
      const BRIDGE_SOURCE = "my-overview-bridge";

      const pageTitle = document.getElementById("pageTitle");
      const statusMessage = document.getElementById("statusMessage");
      const app = document.getElementById("app");
      const refreshButton = document.getElementById("refreshButton");
      const backendFrame = document.getElementById("backendFrame");

      const state = {
        idToken: "",
        role: "employee",
        employeeOverview: null,
        managerOverview: null
      };

      const pendingCalls = new Map();
      let bridgeWindow = null;
      let bridgeLiffId = "";
      let requestNumber = 0;
      let resolveBridge;
      const bridgeReady = new Promise(function(resolve) {
        resolveBridge = resolve;
      });

      refreshButton.addEventListener("click", loadOverviewData);
      window.addEventListener("message", receiveBridgeMessage);
      initializePage();

      async function initializePage() {
        try {
          showLoading("กำลังเชื่อมต่อระบบ…");
          backendFrame.src = BACKEND_URL;
          await waitForBridge();

          showLoading("กำลังเชื่อมต่อ LINE…");
          await initializeLiffWithTimeout();

          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          state.idToken = liff.getIDToken();
          if (!state.idToken) {
            throw new Error("ไม่พบ LINE ID token กรุณาเปิดผ่าน Rich Menu");
          }

          loadOverviewData();
        } catch (error) {
          showError(error);
        }
      }

      function initializeLiffWithTimeout() {
        const timeoutMilliseconds = 15000;
        const timeout = new Promise(function(resolve, reject) {
          window.setTimeout(function() {
            reject(new Error(
              "เชื่อมต่อ LINE ไม่สำเร็จภายใน 15 วินาที กรุณาปิดหน้าแล้วเปิดผ่าน Rich Menu อีกครั้ง"
            ));
          }, timeoutMilliseconds);
        });

        return Promise.race([
          liff.init({
            liffId: bridgeLiffId,
            withLoginOnExternalBrowser: true
          }),
          timeout
        ]);
      }

      function loadOverviewData() {
        showLoading("กำลังโหลดข้อมูล…");

         callBackend("getOverviewPage", {
           month: getCurrentMonth()
         }).then(function(page) {
           handleEmployeeOverviewLoaded(page.employee, page.manager);
         }).catch(showError);
       }

       function handleEmployeeOverviewLoaded(data, managerData) {
        state.employeeOverview = data;
        state.role = data.profile.role;

        if (state.role !== "manager") {
          renderEmployeeOverview(data);
          return;
        }

         state.managerOverview = managerData;
         renderManagerShell();
       }

      function receiveBridgeMessage(event) {
        const data = event.data;
        if (!data || data.source !== BRIDGE_SOURCE) {
          return;
        }

        if (data.type === "ready") {
          bridgeWindow = event.source;
          bridgeLiffId = String(data.liffId || "");
          if (!bridgeLiffId) {
            showError(new Error("Bridge ไม่ส่ง LIFF ID"));
            return;
          }
          resolveBridge();
          return;
        }

        if (data.type !== "response" || event.source !== bridgeWindow) {
          return;
        }

        const pendingRequest = pendingCalls.get(data.id);
        if (!pendingRequest) {
          return;
        }

        window.clearTimeout(pendingRequest.timer);
        pendingCalls.delete(data.id);

        if (data.ok) {
          pendingRequest.resolve(data.result);
        } else {
          pendingRequest.reject(new Error(data.error));
        }
      }

      function waitForBridge() {
        return Promise.race([
          bridgeReady,
          new Promise(function(resolve, reject) {
            window.setTimeout(function() {
              reject(new Error("เชื่อมต่อ Apps Script ไม่สำเร็จ"));
            }, 15000);
          })
        ]);
      }

      function callBackend(action, payload) {
        return new Promise(function(resolve, reject) {
          const requestId = "request-" + (++requestNumber);
          const timer = window.setTimeout(function() {
            pendingCalls.delete(requestId);
            reject(new Error("Apps Script ตอบกลับช้าเกินกำหนด"));
          }, 60000);

          pendingCalls.set(requestId, {
            resolve: resolve,
            reject: reject,
            timer: timer
          });

          bridgeWindow.postMessage({
            source: MESSAGE_SOURCE,
            id: requestId,
            action: action,
            idToken: state.idToken,
            payload: payload || {}
          }, "*");
        });
      }

      function renderManagerShell() {
        pageTitle.textContent = "ภาพรวมของฉัน";
        app.innerHTML = [
          '<div class="tabs">',
          '  <button id="myOverviewTab" type="button">ข้อมูลของฉัน</button>',
          '  <button id="managerOverviewTab" type="button">',
          "    งานค้างวันนี้ (" + state.managerOverview.total + ")",
          "  </button>",
          "</div>",
          '<div id="overviewPanel"></div>'
        ].join("\n");

        document.getElementById("myOverviewTab").addEventListener("click", function() {
          activateManagerTab("employee");
          renderEmployeeOverview(state.employeeOverview, true);
        });

        document.getElementById("managerOverviewTab").addEventListener("click", function() {
          activateManagerTab("manager");
          renderManagerOverview(state.managerOverview);
        });

        showApplication();
        activateManagerTab("manager");
        renderManagerOverview(state.managerOverview);
      }

      function activateManagerTab(activeTab) {
        document.getElementById("myOverviewTab").classList.toggle(
          "active",
          activeTab === "employee"
        );
        document.getElementById("managerOverviewTab").classList.toggle(
          "active",
          activeTab === "manager"
        );
      }

      function renderEmployeeOverview(data, insideManagerShell) {
        pageTitle.textContent = "ข้อมูลของฉัน";

        const today = data.today;
        const month = data.month;
        const target = getContentTarget(insideManagerShell);

        target.innerHTML = [
          renderProfile(data.profile, today.date),
          "<h2>ข้อมูลการเข้างานวันนี้</h2>",
          renderTodayAttendance(today),
          "<h2>สรุปประจำเดือน</h2>",
          renderMonthlyMetrics(month),
          "<h2>งานปัจจุบัน</h2>",
          renderCurrentWork(data.activeWork),
          "<h2>ปฏิทินการเข้างาน</h2>",
          renderAttendanceCalendar(month),
          "<h2>ประวัติการเข้างานล่าสุด</h2>",
          renderAttendanceHistory(data.history),
          "<h2>สถานะคำขอลาของฉัน</h2>",
          renderLeaveRequests(data.leaveRequests)
        ].join("\n");

        showApplication();
      }

      function renderManagerOverview(data) {
        pageTitle.textContent = "งานค้างวันนี้";

        const target = getContentTarget(true);
        const itemHtml = data.items.map(renderManagerPendingItem).join("\n");

        target.innerHTML = [
          '<div class="profile">',
          "  <div>",
          "    <strong>งานค้างทั้งหมด</strong>",
          '    <div class="count">' + data.total + " รายการ</div>",
          "  </div>",
          '  <div class="muted">' + formatThaiDate(data.date) + "</div>",
          "</div>",
          '<div class="list">',
          itemHtml,
          "</div>"
        ].join("\n");

        showApplication();
      }

      function renderProfile(profile, date) {
        return [
          '<div class="profile">',
          "  <div>",
          "    <strong>" + escapeHtml(profile.employeeName) + "</strong>",
          '    <div class="muted">' + escapeHtml(profile.lineDisplayName) + "</div>",
          "  </div>",
          '  <div class="muted">' + formatThaiDate(date) + "</div>",
          "</div>"
        ].join("\n");
      }

      function renderTodayAttendance(today) {
        return [
          '<section class="today-grid">',
          '  <div class="today-item">',
          "    เวลาเข้า",
          '    <div class="value">' + escapeHtml(today.checkIn || "-") + "</div>",
          "  </div>",
          '  <div class="today-item">',
          "    เวลาออก",
          '    <div class="value">' + escapeHtml(today.checkOut || "-") + "</div>",
          "  </div>",
          '  <div class="today-item">',
          "    สถานะวันนี้",
          '    <div class="value ' + getStatusClass(today.status) + '">',
          "      " + escapeHtml(today.status),
          "    </div>",
          "  </div>",
          "</section>"
        ].join("\n");
      }

      function renderMonthlyMetrics(month) {
        return [
          '<section class="metrics">',
          renderMetric("มาทำงาน", month.attendance),
          renderMetric("วันทำงาน", month.workdays),
          renderMetric("ลา", month.leave),
          renderMetric("ขาด", month.absence),
          renderMetric("มาสาย", month.late),
          renderMetric("ออกก่อน", month.early),
          renderMetric("OT", formatMinutes(month.otMinutes)),
          "</section>"
        ].join("\n");
      }

      function renderMetric(label, value) {
        return [
          '<div class="metric">',
          '  <span class="muted">' + escapeHtml(label) + "</span>",
          "  <strong>" + escapeHtml(value) + "</strong>",
          "</div>"
        ].join("\n");
      }

      function renderCurrentWork(activeWork) {
        if (!activeWork) {
          return renderList([renderSimpleRow("ไม่มีงานที่กำลังทำ", "", "success")]);
        }

        const detail = [
          activeWork.startTime || "-",
          activeWork.orderName || activeWork.workType
        ].filter(Boolean).join(" · ");

        return renderList([renderSimpleRow(activeWork.machine, detail)]);
      }

      function renderAttendanceCalendar(month) {
        const monthText = String(month.month || getCurrentMonth());
        const parts = monthText.split("-");
        const year = Number(parts[0]);
        const monthIndex = Number(parts[1]) - 1;
        const firstDay = new Date(Date.UTC(year, monthIndex, 1));
        const daysInMonth = new Date(Date.UTC(year, monthIndex + 1, 0)).getUTCDate();
        const mondayOffset = (firstDay.getUTCDay() + 6) % 7;
        const statusByDate = {};
        (month.calendarDays || []).forEach(function(item) {
          statusByDate[item.date] = item;
        });

        const cells = [];
        for (let index = 0; index < mondayOffset; index += 1) {
          cells.push('<div class="calendar-day empty" aria-hidden="true"></div>');
        }
        for (let day = 1; day <= daysInMonth; day += 1) {
          const date = monthText + "-" + String(day).padStart(2, "0");
          const item = statusByDate[date];
          const status = item && item.status !== "scheduled" ? item.status : "";
          const label = item && item.status !== "scheduled" ? item.label : "";
          const accessibleLabel = formatThaiDate(date) + (label ? " " + label : "");
          cells.push([
            '<div class="calendar-day ' + escapeHtmlAttribute(status) +
              '" aria-label="' + escapeHtmlAttribute(accessibleLabel) + '">',
            '  <span class="calendar-date">' + day + "</span>",
            label ? '  <span class="calendar-status">' + escapeHtml(label) + "</span>" : "",
            "</div>"
          ].join("\n"));
        }

        return [
          '<section class="attendance-calendar" aria-label="ปฏิทินการเข้างานประจำเดือน">',
          '  <div class="calendar-month">' + escapeHtml(formatThaiMonth(monthText)) + "</div>",
          '  <div class="calendar-grid">',
          ["จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส.", "อา."].map(function(dayName) {
            return '<div class="calendar-weekday">' + dayName + "</div>";
          }).join("\n"),
          cells.join("\n"),
          "  </div>",
          '  <div class="calendar-legend">',
          '    <span><i class="legend-dot present-full"></i>มาทำงานเต็มวัน</span>',
          '    <span><i class="legend-dot present-half"></i>ครึ่งวัน</span>',
          '    <span><i class="legend-dot absent"></i>ขาดงาน</span>',
          '    <span><i class="legend-dot leave"></i>ลา</span>',
          "  </div>",
          "</section>"
        ].join("\n");
      }

      function renderAttendanceHistory(history) {
        if (!history.length) {
          return renderList([renderSimpleRow("ยังไม่มีข้อมูลเดือนนี้", "")]);
        }

        const rows = history.slice(0, 10).map(function(item) {
          const detail = (item.checkIn || "-") + " — " + (item.checkOut || "-");
          return renderSimpleRow(
            formatThaiDate(item.date),
            detail,
            getStatusClass(item.status),
            item.status
          );
        });

        return renderList(rows);
      }

      function renderLeaveRequests(requests) {
        if (!requests.length) {
          return renderList([renderSimpleRow("ยังไม่มีคำขอลา", "")]);
        }

        const rows = requests.slice(0, 5).map(function(item) {
          return renderSimpleRow(
            item.type + " · " + formatThaiDate(item.date),
            item.reason || "",
            getStatusClass(item.status),
            item.status
          );
        });

        return renderList(rows);
      }

      function renderManagerPendingItem(item) {
        const details = item.details && item.details.length
          ? item.details.join(" · ")
          : item.ok
            ? "ไม่มีรายการ"
            : "";
        const detailsHtml = (item.key === "leave" || item.key === "work") &&
            item.details && item.details.length
          ? item.details.map(function(detail) {
              return '<div class="pending-detail">' + escapeHtml(detail) + "</div>";
            }).join("")
          : escapeHtml(details);

        const value = item.key === "reports"
          ? item.ok ? "ปกติ" : "ตรวจสอบ"
          : item.count;

        const valueClass = item.ok ? "success" : "count";
        const valueHtml = item.key === "leave" || item.key === "work"
          ? ""
          : '<div class="' + valueClass + '">' + escapeHtml(value) + "</div>";
        const action = item.url
          ? '<a class="link" href="' + escapeHtmlAttribute(item.url) + '">ไปจัดการ</a>'
          : "";

        return [
          '<div class="row pending-row pending-' + escapeHtmlAttribute(item.key) + '">',
          '  <div class="row-main">',
          '    <div class="row-title">' + escapeHtml(item.title) + "</div>",
          '    <div class="muted">' + detailsHtml + "</div>",
          "  </div>",
          "  " + valueHtml,
          "  " + action,
          "</div>"
        ].join("\n");
      }

      function renderSimpleRow(title, detail, statusClass, endValue) {
        const endHtml = endValue
          ? '<div class="' + statusClass + '">' + escapeHtml(endValue) + "</div>"
          : "";

        return [
          '<div class="row">',
          '  <div class="row-main">',
          '    <div class="row-title">' + escapeHtml(title) + "</div>",
          '    <div class="muted">' + escapeHtml(detail) + "</div>",
          "  </div>",
          "  " + endHtml,
          "</div>"
        ].join("\n");
      }

      function renderList(rows) {
        return '<div class="list">\n' + rows.join("\n") + "\n</div>";
      }

      function getContentTarget(insideManagerShell) {
        if (insideManagerShell && state.role === "manager") {
          return document.getElementById("overviewPanel");
        }
        return app;
      }

      function getStatusClass(value) {
        const text = String(value || "");

        if (/ปกติ|เต็มวัน|อนุมัติ/.test(text)) {
          return "success";
        }
        if (/สาย|ก่อน|รอ/.test(text)) {
          return "warning";
        }
        if (/ขาด|ไม่ได้/.test(text)) {
          return "danger";
        }
        return "";
      }

      function getCurrentMonth() {
        return new Date()
          .toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" })
          .slice(0, 7);
      }

      function formatThaiDate(value) {
        if (!value) {
          return "-";
        }

        const date = new Date(value + "T00:00:00+07:00");
        return date.toLocaleDateString("th-TH", {
          day: "numeric",
          month: "short",
          year: "numeric"
        });
      }

      function formatThaiMonth(value) {
        const parts = String(value || "").split("-");
        const date = new Date(Date.UTC(Number(parts[0]), Number(parts[1]) - 1, 1));
        return date.toLocaleDateString("th-TH", {
          month: "long",
          year: "numeric",
          timeZone: "Asia/Bangkok"
        });
      }

      function formatMinutes(value) {
        const minutes = Number(value) || 0;
        return Math.floor(minutes / 60) + ":" +
          String(minutes % 60).padStart(2, "0") + " ชม.";
      }

      function showLoading(message) {
        statusMessage.textContent = message;
        statusMessage.classList.remove("hidden");
        app.classList.add("hidden");
        refreshButton.classList.add("hidden");
      }

      function showApplication() {
        statusMessage.classList.add("hidden");
        app.classList.remove("hidden");
        refreshButton.classList.remove("hidden");
      }

      function showError(error) {
        statusMessage.textContent = error && error.message
          ? error.message
          : String(error);
        statusMessage.classList.remove("hidden");
        app.classList.add("hidden");
        refreshButton.classList.add("hidden");
      }

      function escapeHtml(value) {
        return String(value === null || value === undefined ? "" : value)
          .replace(/[&<>"']/g, function(character) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;"
            }[character];
          });
      }

      function escapeHtmlAttribute(value) {
        return escapeHtml(value);
      }
    </script>
  </body>
</html>
