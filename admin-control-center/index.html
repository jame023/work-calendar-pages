<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Admin Control Center</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      :root { color-scheme: light; --navy:#12305a; --blue:#1769aa; --ink:#172033; --muted:#667085; --line:#d9e2ec; --bg:#f4f7fb; --green:#157347; --amber:#9a6700; --red:#b42318; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans Thai",Tahoma,"Segoe UI",sans-serif; }
      button { min-height:44px; font:inherit; }
      .shell { width:min(1120px,100%); margin:auto; padding:0 16px 40px; }
      header { position:sticky; top:0; z-index:2; margin:0 -16px 20px; padding:16px; color:white; background:linear-gradient(135deg,var(--navy),var(--blue)); box-shadow:0 3px 14px #12305a33; }
      .header-row { width:min(1088px,100%); margin:auto; display:flex; gap:12px; align-items:center; justify-content:space-between; }
      h1 { margin:0; font-size:clamp(1.25rem,4vw,1.75rem); } .subtitle { opacity:.85; font-size:.9rem; }
      .refresh { border:1px solid #ffffff88; border-radius:10px; padding:8px 14px; color:white; background:#ffffff18; cursor:pointer; }
      .status,.card { background:white; border:1px solid var(--line); border-radius:14px; box-shadow:0 5px 18px #12305a0d; }
      .status { padding:14px 16px; margin-bottom:18px; } .status.error { border-color:#f4b7b2; color:var(--red); }
      .profile { display:none; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
      .profile .card { padding:16px; } .label { color:var(--muted); font-size:.82rem; } .value { margin-top:4px; font-weight:700; overflow-wrap:anywhere; }
      .policy { padding:14px 16px; margin-bottom:18px; border-left:4px solid var(--amber); background:#fff9e8; }
      .modules { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
      .module { padding:18px; min-height:142px; display:flex; flex-direction:column; justify-content:space-between; }
      .module h2 { margin:0 0 8px; font-size:1.05rem; } .detail { color:var(--muted); font-size:.9rem; line-height:1.5; }
      .badge { align-self:flex-start; margin-top:16px; padding:5px 9px; border-radius:999px; font-size:.78rem; font-weight:700; }
      .ready { color:var(--green); background:#e8f5ee; } .not-ready { color:var(--amber); background:#fff3cd; }
      .module[data-key="employees"] { cursor:pointer; border-color:#9bc2e6; }
      .employee-panel { margin-top:22px; padding:18px; }
      .panel-head { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
      .panel-head h2 { margin:0; } .search { display:flex; gap:8px; flex:1; max-width:460px; }
      input,select,textarea { width:100%; min-height:44px; border:1px solid #b8c5d3; border-radius:10px; padding:9px 11px; font:inherit; background:white; }
      .primary,.secondary { border:0; border-radius:10px; padding:9px 14px; cursor:pointer; font-weight:700; }
      .primary { color:white; background:var(--blue); } .secondary { color:var(--navy); background:#eaf1f8; }
      .employee-list { display:grid; gap:10px; margin-top:16px; }
      .employee-row { display:grid; grid-template-columns:1.4fr .8fr .8fr auto; gap:10px; align-items:center; padding:13px; border:1px solid var(--line); border-radius:11px; }
      .employee-meta { color:var(--muted); font-size:.86rem; }
      .editor-card { width:100%; margin-top:18px; border:1px solid #9bc2e6; border-radius:14px; background:#f9fbfd; }
      .dialog-body { padding:20px; }
      .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; } label { display:grid; gap:5px; color:var(--muted); font-size:.86rem; }
      .check { display:flex; align-items:center; gap:9px; min-height:44px; color:var(--ink); } .check input { width:20px; min-height:20px; }
      .dialog-actions { position:sticky; bottom:0; display:flex; justify-content:flex-end; gap:9px; margin:18px -20px -20px; padding:12px 20px; border-top:1px solid var(--line); background:white; }
      .preview-box { margin-top:14px; padding:12px; border-radius:10px; background:#f4f7fb; white-space:pre-wrap; font-size:.86rem; }
      [hidden] { display:none !important; }
      @media (max-width:820px) { .modules { grid-template-columns:repeat(2,minmax(0,1fr)); } }
      @media (max-width:600px) { .profile,.modules,.form-grid { grid-template-columns:1fr; } .module { min-height:124px; } .employee-row { grid-template-columns:1fr auto; } .employee-row .employee-meta { grid-column:1; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <header><div class="header-row"><div><h1>Admin Control Center</h1><div class="subtitle">ศูนย์ดูแลทุกระบบ</div></div><button class="refresh" id="refreshButton" type="button">รีเฟรช</button></div></header>
      <main>
        <div class="status" id="status" role="status" aria-live="polite">กำลังเชื่อมต่อระบบ…</div>
        <section class="profile" id="profile" aria-label="ข้อมูลผู้ดูแล">
          <article class="card"><div class="label">ผู้ดูแล</div><div class="value" id="employeeName">-</div></article>
          <article class="card"><div class="label">ชื่อ LINE</div><div class="value" id="lineName">-</div></article>
          <article class="card"><div class="label">สิทธิ์</div><div class="value">Manager · Admin</div></article>
        </section>
        <aside class="policy" id="policy" hidden>ระยะแรกเป็นภาพรวมแบบอ่านอย่างเดียว ยังไม่มีปุ่มแก้ไขหรือลบข้อมูล</aside>
        <section class="modules" id="modules" aria-label="ระบบทั้งหมด"></section>
        <section class="card employee-panel" id="employeePanel" hidden>
          <div class="panel-head"><h2>พนักงานและสิทธิ์</h2><div class="search"><input id="employeeSearch" aria-label="ค้นหาพนักงาน" placeholder="ค้นชื่อ รหัส หรือกลุ่มงาน"><button class="primary" id="employeeSearchButton" type="button">ค้นหา</button></div></div>
          <div class="employee-list" id="employeeList"></div>
          <div class="editor-card" id="employeeDialog" hidden><form class="dialog-body" id="employeeForm">
            <h2 id="dialogTitle">แก้ไขพนักงาน</h2>
            <div class="form-grid">
              <label>ชื่อพนักงาน<input id="editName" required maxlength="100"></label>
              <label>รหัสพนักงาน<input id="editCode" required maxlength="50"></label>
              <label>Role<select id="editRole"><option value="employee">employee</option><option value="manager">manager</option></select></label>
              <label>กลุ่มงาน<input id="editGroups" placeholder="ผลิต, สกรีน"></label>
              <label>กลุ่มงานหลัก<input id="editPrimaryGroup"></label>
              <div><label class="check"><input id="editActive" type="checkbox"> Active</label><label class="check"><input id="editAdmin" type="checkbox"> Admin</label></div>
            </div>
            <label>เหตุผล<textarea id="editReason" required minlength="3" maxlength="300" rows="3"></textarea></label>
            <div id="confirmationWrap" hidden><label>พิมพ์คำว่า ยืนยัน<input id="editConfirmation" autocomplete="off"></label></div>
            <div class="preview-box" id="employeePreview" hidden></div>
            <div class="dialog-actions"><button class="secondary" id="cancelEdit" type="button">ยกเลิก</button><button class="secondary" id="previewEdit" type="button">Preview</button><button class="primary" id="applyEdit" type="button" hidden>บันทึก</button></div>
          </form></div>
        </section>
      </main>
    </div>
    <iframe id="bridge" title="Admin backend bridge" hidden></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const DEFAULT_BRIDGE_URL = "https://script.google.com/macros/s/AKfycbzQXDl8Kav9Jmh_PtFmrGSKexHhaqzZC_0sw5mTotSbSeS2dL1qRVfn2KvPyC6FwTsldw/exec";
      const BRIDGE_URL = params.get("bridge") || DEFAULT_BRIDGE_URL;
      const FRONTEND_SOURCE = "admin-center-frontend";
      const BRIDGE_SOURCE = "admin-center-bridge";
      const pending = new Map();
      let bridgeOrigin = "";
      let idToken = "";
      let liffId = "";
      let selectedEmployee = null;
      let employeePlan = null;
      document.getElementById("refreshButton").addEventListener("click", loadOverview);
      document.getElementById("employeeSearchButton").addEventListener("click", loadEmployees);
      document.getElementById("cancelEdit").addEventListener("click", closeEmployeeDialog);
      document.getElementById("previewEdit").addEventListener("click", previewEmployeeEdit);
      document.getElementById("applyEdit").addEventListener("click", applyEmployeeEdit);
      window.addEventListener("message", receiveBridgeMessage);
      start();

      async function start() {
        try {
          if (!BRIDGE_URL) throw new Error("URL นี้ยังไม่มีค่า bridge");
          bridgeOrigin = new URL(BRIDGE_URL).origin;
          document.getElementById("bridge").src = BRIDGE_URL;
          await waitForBridge();
          await initializeLiffWithTimeout(liffId);
          if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
          idToken = liff.getIDToken();
          await loadOverview();
        } catch (error) { showError(error); }
      }

      async function initializeLiffWithTimeout(value) {
        await Promise.race([
          liff.init({ liffId: value }),
          new Promise(function(_, reject) { setTimeout(function() { reject(new Error("เชื่อมต่อ LINE ไม่สำเร็จภายใน 15 วินาที")); }, 15000); })
        ]);
      }

      function waitForBridge() {
        return new Promise(function(resolve, reject) {
          const timer = setTimeout(function() { reject(new Error("เชื่อมต่อ backend ไม่สำเร็จ")); }, 15000);
          window.bridgeReady = function() { clearTimeout(timer); resolve(); };
        });
      }

      async function loadOverview() {
        setStatus("กำลังตรวจสิทธิ์และโหลดภาพรวม…", false);
        try {
          const data = await callBackend("getAdminBootstrap", {});
          renderOverview(data);
        } catch (error) { showError(error); }
      }

      function callBackend(action, payload) {
        return new Promise(function(resolve, reject) {
          const id = Date.now() + "-" + Math.random().toString(16).slice(2);
          pending.set(id, { resolve:resolve, reject:reject });
          document.getElementById("bridge").contentWindow.postMessage({
            source:FRONTEND_SOURCE, id:id, action:action, idToken:idToken, payload:payload
          }, bridgeOrigin);
          setTimeout(function() { if (pending.has(id)) { pending.delete(id); reject(new Error("backend ตอบกลับช้าเกินไป")); } }, 20000);
        });
      }

      function receiveBridgeMessage(event) {
        if (event.origin !== bridgeOrigin || !event.data || event.data.source !== BRIDGE_SOURCE) return;
        if (event.data.type === "ready") { liffId = event.data.liffId; if (window.bridgeReady) window.bridgeReady(); return; }
        const request = pending.get(event.data.id); if (!request) return;
        pending.delete(event.data.id);
        event.data.ok ? request.resolve(event.data.result) : request.reject(new Error(event.data.error));
      }

      function renderOverview(data) {
        document.getElementById("employeeName").textContent = data.profile.employeeName || "-";
        document.getElementById("lineName").textContent = data.profile.lineDisplayName || "-";
        document.getElementById("profile").style.display = "grid";
        document.getElementById("policy").textContent = "การแก้ไขข้อมูลพนักงานต้อง Preview ระบุเหตุผล และบันทึก Audit Log · ไม่มี hard delete";
        document.getElementById("policy").hidden = false;
        document.getElementById("modules").replaceChildren(...data.modules.map(function(item) {
          const card = document.createElement("article"); card.className = "card module";
          const content = document.createElement("div");
          const title = document.createElement("h2"); title.textContent = item.title;
          const detail = document.createElement("div"); detail.className = "detail"; detail.textContent = item.detail;
          const badge = document.createElement("span"); badge.className = "badge " + (item.ready ? "ready" : "not-ready"); badge.textContent = item.ready ? "พร้อมเชื่อมต่อ" : "ต้องตั้งค่า";
          content.append(title, detail); card.append(content, badge);
          card.dataset.key = item.key;
          if (item.key === "employees" && item.ready) card.addEventListener("click", openEmployees);
          return card;
        }));
        setStatus("ยืนยันสิทธิ์ Admin แล้ว · อัปเดต " + new Date(data.generatedAt).toLocaleString("th-TH"), false);
      }

      async function openEmployees() {
        document.getElementById("employeePanel").hidden = false;
        await loadEmployees();
        document.getElementById("employeePanel").scrollIntoView({ behavior:"smooth", block:"start" });
      }

      async function loadEmployees() {
        const list = document.getElementById("employeeList");
        list.textContent = "กำลังโหลด…";
        try {
          const employees = await callBackend("getAdminEmployees", { query:document.getElementById("employeeSearch").value });
          if (!employees.length) { list.textContent = "ไม่พบพนักงาน"; return; }
          list.replaceChildren(...employees.map(function(employee) {
            const row=document.createElement("article"); row.className="employee-row";
            const name=document.createElement("strong"); name.textContent=employee.employeeName;
            const code=document.createElement("span"); code.className="employee-meta"; code.textContent=employee.employeeCode;
            const meta=document.createElement("span"); meta.className="employee-meta"; meta.textContent=employee.role + (employee.admin ? " · Admin" : "") + (employee.active ? " · Active" : " · ปิดใช้งาน");
            const edit=document.createElement("button"); edit.type="button"; edit.className="secondary"; edit.textContent="แก้ไข"; edit.addEventListener("click",function(){ openEmployeeEditor(employee); });
            row.append(name,code,meta,edit); return row;
          }));
        } catch (error) { list.textContent=error.message || String(error); }
      }

      function openEmployeeEditor(employee) {
        selectedEmployee = employee; employeePlan = null;
        document.getElementById("editName").value=employee.employeeName;
        document.getElementById("editCode").value=employee.employeeCode;
        document.getElementById("editRole").value=employee.role;
        document.getElementById("editGroups").value=employee.workGroups;
        document.getElementById("editPrimaryGroup").value=employee.primaryWorkGroup;
        document.getElementById("editActive").checked=employee.active;
        document.getElementById("editAdmin").checked=employee.admin;
        document.getElementById("editReason").value="";
        document.getElementById("editConfirmation").value="";
        document.getElementById("confirmationWrap").hidden=true;
        document.getElementById("employeePreview").hidden=true;
        document.getElementById("applyEdit").hidden=true;
        const editor = document.getElementById("employeeDialog");
        editor.hidden = false;
        editor.scrollIntoView({ behavior:"smooth", block:"start" });
      }

      function employeeDraft() {
        return { employeeName:document.getElementById("editName").value, employeeCode:document.getElementById("editCode").value,
          role:document.getElementById("editRole").value, workGroups:document.getElementById("editGroups").value,
          primaryWorkGroup:document.getElementById("editPrimaryGroup").value, active:document.getElementById("editActive").checked,
          admin:document.getElementById("editAdmin").checked };
      }

      async function previewEmployeeEdit() {
        try {
          employeePlan=await callBackend("previewAdminEmployeeUpdate", { recordId:selectedEmployee.recordId, draft:employeeDraft(), reason:document.getElementById("editReason").value });
          const box=document.getElementById("employeePreview");
          box.textContent="ก่อน: " + summarizeEmployee(employeePlan.before) + "\nหลัง: " + summarizeEmployee(employeePlan.after);
          box.hidden=false;
          document.getElementById("confirmationWrap").hidden=!employeePlan.requiresConfirmation;
          document.getElementById("applyEdit").hidden=false;
        } catch(error) { showError(error); }
      }

      async function applyEmployeeEdit() {
        if (!employeePlan) return;
        try {
          const result=await callBackend("applyAdminEmployeeUpdate", { recordId:selectedEmployee.recordId, draft:employeePlan.after,
            reason:employeePlan.reason, expectedBefore:employeePlan.before, confirmation:document.getElementById("editConfirmation").value,
            requestId:createRequestId() });
          closeEmployeeDialog();
          setStatus(result.duplicate ? "คำขอนี้บันทึกไว้แล้ว" : "บันทึกข้อมูลพนักงานและ Audit Log แล้ว", false);
          await loadEmployees();
        } catch(error) { showError(error); }
      }

      function summarizeEmployee(item) { return [item.employeeName,item.employeeCode,item.role,item.active?"Active":"ปิดใช้งาน",item.admin?"Admin":"ไม่ใช่ Admin",item.workGroups||"ไม่มีกลุ่ม"].join(" · "); }
      function createRequestId() { return "ADMIN-" + Date.now() + "-" + Math.random().toString(16).slice(2); }
      function closeEmployeeDialog() {
        document.getElementById("employeeDialog").hidden = true;
      }

      function setStatus(message, error) { const box=document.getElementById("status"); box.textContent=message; box.classList.toggle("error",!!error); }
      function showError(error) { setStatus(error && error.message ? error.message : String(error), true); }
    </script>
  </body>
</html>
