<!doctype html>
<html lang="th">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>จัดการวันทำงาน</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      :root {
        --navy:#16324f;
        --blue:#1f6feb;
        --green:#16864b;
        --amber:#b26a00;
        --red:#bd2c24;
        --border:#d7dee7;
        --surface:#fff;
      }
      * { box-sizing:border-box; }
      body {
        margin:0;
        background:#f3f6fa;
        color:#17202b;
        font-family:system-ui,"Segoe UI",sans-serif;
      }
      button,input { font:inherit; }
      button { cursor:pointer; }
      .page { width:min(1050px,100%); margin:auto; padding:16px; }
      .header,.card {
        border:1px solid var(--border);
        border-radius:16px;
        background:var(--surface);
        box-shadow:0 8px 24px rgb(22 50 79 / 8%);
      }
      .header { padding:18px; }
      h1,h2,p { margin-top:0; }
      h1 { margin-bottom:6px; font-size:clamp(24px,6vw,32px); }
      h2 { margin-bottom:12px; font-size:20px; }
      .muted { margin-bottom:0; color:#627083; }
      .status {
        margin-top:14px;
        border-radius:12px;
        padding:12px 14px;
      }
      .info { background:#e9f2ff; color:#144f98; }
      .success { background:#e5f6ed; color:var(--green); }
      .error { background:#fdecea; color:var(--red); }
      .card { display:none; margin-top:14px; padding:18px; }
      .card.show { display:block; }
      .toolbar {
        display:grid;
        grid-template-columns:minmax(180px,1fr) auto;
        gap:12px;
        align-items:end;
      }
      label { display:block; color:var(--navy); font-weight:700; }
      input[type="month"],.primary,.secondary {
        min-height:48px;
        border-radius:10px;
        padding:10px 14px;
      }
      input[type="month"] {
        width:100%;
        margin-top:7px;
        border:1px solid var(--border);
        background:#fff;
      }
      .primary,.secondary {
        border:0;
        font-weight:750;
      }
      .primary { background:var(--blue); color:#fff; }
      .secondary { background:#e8eef6; color:var(--navy); }
      .send-button {
        width:100%;
        min-height:54px;
        margin-top:16px;
        border:0;
        border-radius:10px;
        padding:10px 14px;
        background:var(--red);
        color:#fff;
        font-size:18px;
        font-weight:800;
      }
      button:disabled { cursor:not-allowed; opacity:.55; }
      .quick-actions {
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:10px;
        margin-top:14px;
      }
      .summary {
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:10px;
        margin:14px 0;
      }
      .summary-item {
        border-radius:12px;
        padding:12px;
        text-align:center;
        font-weight:750;
      }
      .summary-item span { display:block; margin-top:3px; font-size:22px; }
      .summary-full { background:#e5f6ed; color:var(--green); }
      .summary-half { background:#fff3d8; color:var(--amber); }
      .summary-off { background:#fdecea; color:var(--red); }
      .weekdays,.calendar-grid {
        display:grid;
        grid-template-columns:repeat(7,minmax(0,1fr));
        gap:8px;
      }
      .weekdays div {
        padding:7px 2px;
        color:#627083;
        text-align:center;
        font-size:13px;
        font-weight:750;
      }
      .day-card {
        min-height:112px;
        border:2px solid transparent;
        border-radius:12px;
        padding:9px;
        background:#f7f9fc;
      }
      .day-card.full { border-color:#9bd5b5; background:#f0faf4; }
      .day-card.half { border-color:#e8c77c; background:#fff9e9; }
      .day-card.off { border-color:#e4a29d; background:#fff3f2; }
      .empty-day { min-height:1px; }
      .day-number { margin-bottom:8px; color:var(--navy); font-size:18px; font-weight:800; }
      .status-buttons { display:grid; gap:5px; }
      .status-button {
        min-height:27px;
        border:1px solid var(--border);
        border-radius:7px;
        padding:3px;
        background:#fff;
        color:#445267;
        font-size:12px;
      }
      .status-button.selected { border-color:transparent; color:#fff; font-weight:750; }
      .status-button.full.selected { background:var(--green); }
      .status-button.half.selected { background:var(--amber); }
      .status-button.off.selected { background:var(--red); }
      .save-bar {
        position:sticky;
        bottom:0;
        margin-top:14px;
        padding:12px 0 2px;
        background:linear-gradient(to bottom,transparent,#fff 24%);
      }
      .save-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .save-bar button { width:100%; min-height:54px; font-size:17px; }
      .preview-message {
        margin:12px 0;
        border:1px solid var(--border);
        border-radius:12px;
        padding:14px;
        background:#f7f9fc;
        white-space:pre-wrap;
        overflow-wrap:anywhere;
        font-family:inherit;
        line-height:1.55;
      }
      .recipient-list {
        margin:0;
        padding-left:22px;
        columns:2;
      }
      .backend-frame {
        position:fixed;
        left:-10px;
        bottom:-10px;
        width:1px;
        height:1px;
        border:0;
        opacity:.01;
        pointer-events:none;
      }
      @media(max-width:700px) {
        .page { padding:10px; }
        .header,.card { border-radius:12px; padding:14px; }
        .toolbar { grid-template-columns:1fr; }
        .quick-actions { grid-template-columns:1fr; }
        .save-actions { grid-template-columns:1fr; }
        .recipient-list { columns:1; }
        .weekdays,.calendar-grid { gap:4px; }
        .day-card { min-height:86px; padding:5px; }
        .day-number { margin-bottom:4px; font-size:15px; }
        .status-button { min-height:24px; padding:2px 0; font-size:10px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="header">
        <h1>จัดการวันทำงาน</h1>
        <p class="muted" id="signedInName">กำลังตรวจสอบสิทธิ์ผู้บริหารผ่าน LINE…</p>
      </section>

      <div class="status info" id="statusBox">กำลังเชื่อมต่อระบบ…</div>

      <section class="card" id="calendarCard">
        <div class="toolbar">
          <label>
            เลือกเดือน
            <input id="monthInput" type="month">
          </label>
          <button class="primary" id="loadButton" type="button">โหลดเดือนนี้</button>
        </div>

        <div class="quick-actions">
          <button class="secondary" id="sundayButton" type="button">หยุดทุกวันอาทิตย์</button>
          <button class="secondary" id="weekendButton" type="button">หยุดเสาร์–อาทิตย์</button>
          <button class="secondary" id="fullMonthButton" type="button">ตั้งเป็นเต็มวันทั้งหมด</button>
        </div>

        <div class="summary">
          <div class="summary-item summary-full">เต็มวัน<span id="fullCount">0</span></div>
          <div class="summary-item summary-half">ครึ่งวัน<span id="halfCount">0</span></div>
          <div class="summary-item summary-off">หยุด<span id="offCount">0</span></div>
        </div>

        <div class="weekdays">
          <div>อา.</div><div>จ.</div><div>อ.</div><div>พ.</div>
          <div>พฤ.</div><div>ศ.</div><div>ส.</div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>

        <div class="save-bar">
          <div class="save-actions">
            <button class="primary" id="saveButton" type="button">บันทึกลง Work_Calendar</button>
            <button class="secondary" id="previewButton" type="button">ดูตัวอย่างแจ้งเตือน</button>
          </div>
        </div>
      </section>

      <section class="card" id="notificationCard">
        <h2>ตัวอย่างข้อความแจ้งพนักงาน</h2>
        <p class="muted" id="recipientCount">ผู้รับ 0 คน</p>
        <pre class="preview-message" id="previewMessage"></pre>
        <h2>รายชื่อผู้รับ</h2>
        <ul class="recipient-list" id="recipientList"></ul>
        <button class="send-button" id="sendButton" type="button" hidden>
          ส่งแจ้งเตือนพนักงาน
        </button>
        <p class="muted" id="notificationNote">
          ขั้นตอนนี้เป็น Preview เท่านั้น ระบบยังไม่ส่งข้อความ LINE
        </p>
      </section>
    </main>

    <iframe class="backend-frame" id="backendFrame" title="Apps Script backend"></iframe>

    <script>
      const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzHZX3vWjGXouACldLUbujIZPJ7-Sd8ia4vSmDqW69YkgLFf4xOxCTOF3tcpg_grQ6d/exec";
      const MESSAGE_SOURCE = "work-calendar-frontend";
      const BRIDGE_SOURCE = "work-calendar-bridge";
      const state = {
        idToken:"",
        month:"",
        days:[]
      };
      const pending = new Map();
      let bridgeWindow = null;
      let bridgeLiffId = "";
      let requestNumber = 0;
      let resolveBridge;
      const bridgeReady = new Promise(function(resolve) {
        resolveBridge = resolve;
      });
      const elements = {};

      [
        "signedInName","statusBox","calendarCard","monthInput","loadButton",
        "sundayButton","weekendButton","fullMonthButton","fullCount","halfCount",
        "offCount","calendarGrid","saveButton","previewButton","notificationCard",
        "recipientCount","previewMessage","recipientList","sendButton",
        "notificationNote","backendFrame"
      ].forEach(function(id) {
        elements[id] = document.getElementById(id);
      });

      window.addEventListener("message", receiveBridgeMessage);
      window.addEventListener("load", initialize);
      elements.loadButton.addEventListener("click", loadSelectedMonth);
      elements.monthInput.addEventListener("change", loadSelectedMonth);
      elements.sundayButton.addEventListener("click", function() { setWeekendStatuses([0]); });
      elements.weekendButton.addEventListener("click", function() { setWeekendStatuses([0, 6]); });
      elements.fullMonthButton.addEventListener("click", setFullMonth);
      elements.saveButton.addEventListener("click", saveMonth);
      elements.previewButton.addEventListener("click", previewNotification);
      elements.sendButton.addEventListener("click", sendNotification);

      async function initialize() {
        try {
          setBusy(true);
          if (BACKEND_URL.indexOf("PASTE_") === 0) {
            throw new Error("ยังไม่ได้ใส่ Work Calendar Web App URL");
          }
          elements.backendFrame.src = BACKEND_URL;
          await waitForBridge();
          await liff.init({ liffId:bridgeLiffId, withLoginOnExternalBrowser:true });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          state.idToken = liff.getIDToken();
          if (!state.idToken) throw new Error("LINE ไม่ได้ส่ง ID token");
          const profile = await liff.getProfile();
          elements.signedInName.textContent = "เข้าสู่ระบบ: " + profile.displayName;
          elements.monthInput.value = currentMonthText();
          await loadSelectedMonth();
          elements.calendarCard.classList.add("show");
        } catch (error) {
          showStatus(messageOf(error), "error");
        } finally {
          setBusy(false);
        }
      }

      async function loadSelectedMonth() {
        const month = elements.monthInput.value;
        if (!month) return;
        setBusy(true);
        showStatus("กำลังโหลด Work_Calendar…", "info");
        try {
          const result = await callBackend("getWorkCalendarMonth", { month:month });
          state.month = result.month;
          state.days = result.days || [];
          renderCalendar();
          showStatus("โหลดข้อมูลเดือนนี้แล้ว วันที่ไม่มีข้อมูลตั้งต้นเป็นเต็มวัน", "success");
        } catch (error) {
          showStatus(messageOf(error), "error");
        } finally {
          setBusy(false);
        }
      }

      function renderCalendar() {
        elements.calendarGrid.replaceChildren();
        if (!state.days.length) return;

        const firstWeekday = new Date(state.days[0].date + "T00:00:00").getDay();
        for (let index = 0; index < firstWeekday; index += 1) {
          const spacer = document.createElement("div");
          spacer.className = "empty-day";
          elements.calendarGrid.appendChild(spacer);
        }

        state.days.forEach(function(day) {
          const card = document.createElement("div");
          card.className = "day-card " + statusClass(day.status);

          const number = document.createElement("div");
          number.className = "day-number";
          number.textContent = Number(day.date.slice(-2));
          card.appendChild(number);

          const buttons = document.createElement("div");
          buttons.className = "status-buttons";
          ["เต็มวัน", "ครึ่งวัน", "หยุด"].forEach(function(status) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "status-button " + statusClass(status) +
              (day.status === status ? " selected" : "");
            button.textContent = status;
            button.addEventListener("click", function() {
              day.status = status;
              renderCalendar();
            });
            buttons.appendChild(button);
          });

          card.appendChild(buttons);
          elements.calendarGrid.appendChild(card);
        });

        updateSummary();
      }

      function setWeekendStatuses(weekdays) {
        state.days.forEach(function(day) {
          const weekday = new Date(day.date + "T00:00:00").getDay();
          if (weekdays.indexOf(weekday) !== -1) day.status = "หยุด";
        });
        renderCalendar();
      }

      function setFullMonth() {
        state.days.forEach(function(day) { day.status = "เต็มวัน"; });
        renderCalendar();
      }

      async function saveMonth() {
        if (!state.month || !state.days.length) return;
        const summary = countStatuses();
        const confirmed = window.confirm(
          "บันทึกเดือน " + state.month + " ใช่หรือไม่?\n" +
          "เต็มวัน " + summary.full + " | ครึ่งวัน " + summary.half +
          " | หยุด " + summary.off
        );
        if (!confirmed) return;

        setBusy(true);
        showStatus("กำลังบันทึกลง Work_Calendar…", "info");
        try {
          const result = await callBackend("saveWorkCalendarMonth", {
            month:state.month,
            days:state.days
          });
          showStatus(
            "บันทึกแล้ว " + result.savedDays + " วัน · เต็มวัน " + result.fullDays +
            " · ครึ่งวัน " + result.halfDays + " · หยุด " + result.holidays,
            "success"
          );
        } catch (error) {
          showStatus(messageOf(error), "error");
        } finally {
          setBusy(false);
        }
      }

      async function previewNotification() {
        if (!state.month) return;
        setBusy(true);
        showStatus("กำลังสร้างตัวอย่างข้อความและรายชื่อผู้รับ…", "info");
        try {
          const result = await callBackend("previewWorkCalendarNotification", {
            month:state.month
          });
          elements.recipientCount.textContent =
            "ผู้รับ " + result.recipientCount + " คน";
          elements.previewMessage.textContent = result.message || "";
          elements.recipientList.replaceChildren();
          (result.recipients || []).forEach(function(recipient) {
            const item = document.createElement("li");
            item.textContent = recipient.employeeName ||
              recipient.lineDisplayName || "ไม่มีชื่อ";
            elements.recipientList.appendChild(item);
          });
          elements.notificationCard.classList.add("show");
          elements.sendButton.hidden = result.recipientCount < 1;
          elements.sendButton.disabled = false;
          elements.notificationNote.textContent =
            "ตรวจข้อความและรายชื่อก่อนกดส่ง ระบบจะขอยืนยันอีกครั้ง";
          showStatus(
            "สร้าง Preview แล้ว ระบบยังไม่ได้ส่งข้อความ LINE",
            "success"
          );
          elements.notificationCard.scrollIntoView({
            behavior:"smooth",
            block:"start"
          });
        } catch (error) {
          showStatus(messageOf(error), "error");
        } finally {
          setBusy(false);
        }
      }

      async function sendNotification() {
        const recipientText = elements.recipientCount.textContent;
        const confirmed = window.confirm(
          "ยืนยันส่งข้อความตารางเดือน " + state.month + "?\n" +
          recipientText + "\n\n" +
          "เมื่อยืนยัน ระบบจะส่ง LINE จริงทันที"
        );
        if (!confirmed) return;

        setBusy(true);
        showStatus("กำลังส่งแจ้งเตือนพนักงานทาง LINE…", "info");
        try {
          const result = await callBackend("sendWorkCalendarNotification", {
            month:state.month,
            confirmation:"SEND_ACTIVE_EMPLOYEES"
          });
          elements.sendButton.hidden = true;
          elements.notificationNote.textContent =
            "ส่งข้อความสำเร็จแล้ว " + result.sentCount + " คน";
          showStatus(
            "ส่งแจ้งเตือน LINE สำเร็จ " + result.sentCount + " คน",
            "success"
          );
        } catch (error) {
          showStatus(messageOf(error), "error");
        } finally {
          setBusy(false);
        }
      }

      function receiveBridgeMessage(event) {
        const data = event.data;
        if (!data || data.source !== BRIDGE_SOURCE) return;
        if (data.type === "ready") {
          bridgeWindow = event.source;
          bridgeLiffId = String(data.liffId || "");
          if (!bridgeLiffId) {
            showStatus("Bridge ไม่ส่ง LIFF ID", "error");
            return;
          }
          resolveBridge();
          return;
        }
        if (data.type !== "response" || event.source !== bridgeWindow) return;
        const request = pending.get(data.id);
        if (!request) return;
        clearTimeout(request.timer);
        pending.delete(data.id);
        data.ok ? request.resolve(data.result) :
          request.reject(new Error(data.error));
      }

      function waitForBridge() {
        return Promise.race([
          bridgeReady,
          new Promise(function(resolve, reject) {
            setTimeout(function() {
              reject(new Error("เชื่อมต่อ Apps Script ไม่สำเร็จ"));
            }, 15000);
          })
        ]);
      }

      function callBackend(action, payload) {
        return new Promise(function(resolve, reject) {
          const id = "request-" + (++requestNumber);
          const timer = setTimeout(function() {
            pending.delete(id);
            reject(new Error("Apps Script ตอบกลับช้าเกินกำหนด"));
          }, 20000);
          pending.set(id, { resolve:resolve, reject:reject, timer:timer });
          bridgeWindow.postMessage({
            source:MESSAGE_SOURCE,
            id:id,
            action:action,
            idToken:state.idToken,
            payload:payload || {}
          }, "*");
        });
      }

      function updateSummary() {
        const summary = countStatuses();
        elements.fullCount.textContent = summary.full;
        elements.halfCount.textContent = summary.half;
        elements.offCount.textContent = summary.off;
      }

      function countStatuses() {
        return state.days.reduce(function(total, day) {
          if (day.status === "ครึ่งวัน") total.half += 1;
          else if (day.status === "หยุด") total.off += 1;
          else total.full += 1;
          return total;
        }, { full:0, half:0, off:0 });
      }

      function statusClass(status) {
        if (status === "ครึ่งวัน") return "half";
        if (status === "หยุด") return "off";
        return "full";
      }

      function currentMonthText() {
        const now = new Date();
        return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
      }

      function setBusy(busy) {
        [
          elements.monthInput,elements.loadButton,elements.sundayButton,
          elements.weekendButton,elements.fullMonthButton,elements.saveButton,
          elements.previewButton,elements.sendButton
        ].forEach(function(element) {
          element.disabled = busy;
        });
      }

      function showStatus(message, type) {
        elements.statusBox.textContent = message;
        elements.statusBox.className = "status " + type;
      }

      function messageOf(error) {
        return error && error.message ? error.message : String(error);
      }
    </script>
  </body>
</html>
